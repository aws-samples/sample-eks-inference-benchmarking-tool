# NCCL all-reduce microbenchmark on one g7e.12xlarge (2 GPUs behind one PCIe switch), without a model or vLLM.
# Requires a g7e.12xlarge node that reports nvidia.com/gpu: 2. Re-apply under a new metadata.name for each arm below.
apiVersion: batch/v1
kind: Job
metadata:
  name: nccl-p2p-allreduce-g7e-p2p   # ARM 1. For ARM 2 rename to -g7e-shm and set the disable flag.
  labels:
    app: nccl-p2p-study
spec:
  backoffLimit: 0
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app: nccl-p2p-study
    spec:
      restartPolicy: Never
      nodeSelector:
        node.kubernetes.io/instance-type: g7e.12xlarge
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: nccl-tests
          # Builds nccl-tests from source (~2 min). On "no kernel image is available", use a CUDA >=12.8 devel tag
          # and build with NVCC_GENCODE="-gencode=arch=compute_120,code=sm_120".
          image: nvidia/cuda:12.4.1-devel-ubuntu22.04
          command:
            - bash
            - -lc
            - |
              set -euo pipefail
              echo "=== GPU topology (expect the 2 GPUs at PIX / single-switch distance) ==="
              nvidia-smi topo -m || true
              echo "=== build nccl-tests ==="
              apt-get update -qq
              apt-get install -y -qq --allow-change-held-packages git make libnccl2 libnccl-dev
              git clone -q https://github.com/NVIDIA/nccl-tests /tmp/nccl-tests
              make -C /tmp/nccl-tests -j MPI=0 CUDA_HOME=/usr/local/cuda
              echo "=== all_reduce_perf (2 GPUs, 8B -> 2GiB) ==="
              # -g 2: one process drives both GPUs.
              /tmp/nccl-tests/build/all_reduce_perf -b 8 -e 2G -f 2 -g 2
          env:
            # Variable under test.
            # ARM 1 (switch-local P2P): leave both entries below commented out.
            # - name: NCCL_P2P_LEVEL
            #   value: "PIX"          # same as the default on this single-switch topology
            # ARM 2 (host-staged SHM): uncomment to disable P2P.
            # - name: NCCL_P2P_DISABLE
            #   value: "1"
            # Diagnostics: NCCL logs "P2P/direct pointer" for P2P or "SHM/direct" for host staging.
            - name: NCCL_DEBUG
              value: "INFO"
            - name: NCCL_DEBUG_SUBSYS
              value: "GRAPH,P2P,NET"
          resources:
            limits:
              nvidia.com/gpu: 2
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
