# NCCL all-reduce microbenchmark on one g7.24xlarge (4 GPUs, PCIe, no NVLink), without a model or vLLM.
# Requires the open-kernel-module fix in k8s/examples/job-node-driver-fix.yaml so the GPUs register.
#
# Set NCCL_P2P_LEVEL below and re-apply under a new name for each setting:
#   PIX: P2P only within a single PCIe switch
#   PHB: P2P through the PCIe host bridge
#   NCCL_P2P_DISABLE="1" with NCCL_P2P_LEVEL removed: host staging, no P2P
#   NCCL_P2P_LEVEL removed: NCCL default selection
apiVersion: batch/v1
kind: Job
metadata:
  name: nccl-p2p-allreduce-pix   # rename per setting: -pix / -phb / -disabled / -auto
  labels:
    app: nccl-p2p-study
spec:
  backoffLimit: 0
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app: nccl-p2p-study
    spec:
      restartPolicy: Never
      nodeSelector:
        node.kubernetes.io/instance-type: g7.24xlarge
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: nccl-tests
          # Builds nccl-tests from source (~2 min). Swap in a prebuilt nccl-tests image if you have one.
          image: nvidia/cuda:12.4.1-devel-ubuntu22.04
          command:
            - bash
            - -lc
            - |
              set -euo pipefail
              echo "=== GPU topology ==="
              nvidia-smi topo -m || true
              echo "=== build nccl-tests ==="
              apt-get update -qq
              apt-get install -y -qq git make libnccl2 libnccl-dev
              git clone -q https://github.com/NVIDIA/nccl-tests /tmp/nccl-tests
              make -C /tmp/nccl-tests -j MPI=0 CUDA_HOME=/usr/local/cuda
              echo "=== all_reduce_perf (4 GPUs, 8B -> 2GiB) ==="
              # -g 4: one process drives all four GPUs.
              /tmp/nccl-tests/build/all_reduce_perf -b 8 -e 2G -f 2 -g 4
          env:
            # Variable under test.
            - name: NCCL_P2P_LEVEL
              value: "PIX"          # <-- change to PHB for the second run
            # - name: NCCL_P2P_DISABLE
            #   value: "1"          # uncomment (and drop NCCL_P2P_LEVEL) to force host staging
            # Diagnostics: log the transport NCCL selects.
            - name: NCCL_DEBUG
              value: "INFO"
            - name: NCCL_DEBUG_SUBSYS
              value: "GRAPH,P2P,NET"
          resources:
            limits:
              nvidia.com/gpu: 4
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
