#
# Job that downloads the published GLM 5.2 NVFP4 weights onto the shared PVC. Apply this once per filesystem before the glm-5.2-nvfp4 recipe that mounts a PVC, and expect a long transfer: the checkpoint is 47 shards, 432.9 GiB.
#
# Pin this to a node in the filesystem's own AZ so the write path stays intra-AZ.
#
# SUBSTITUTE: fsx-pvc, and the nodeSelector instance type.
apiVersion: batch/v1
kind: Job
metadata:
  name: download-glm-52-nvfp4
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: download-glm-52-nvfp4
    spec:
      restartPolicy: Never
      nodeSelector:
        node.kubernetes.io/instance-type: m5.8xlarge
      containers:
        - name: downloader
          image: python:3.12-slim
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          command: ["bash", "-c"]
          env:
            - name: MODEL_REPO
              value: nvidia/GLM-5.2-NVFP4
            - name: MODEL_DIR
              value: /models/glm-5.2-nvfp4
            - name: HF_HUB_VERSION
              value: "1.28.0"
            - name: HF_HOME
              value: /models/.hf-cache
            - name: HF_XET_HIGH_PERFORMANCE
              value: "1"
            # This repo is public and ungated, so no HUGGING_FACE_HUB_TOKEN is required. Add one
            # if you are rate-limited: unauthenticated requests get lower limits.
          args:
            - |
              set -eux
              pip install --no-cache-dir -q "huggingface_hub==$HF_HUB_VERSION"
              df -h /models
              date -u +'start %Y-%m-%dT%H:%M:%SZ'
              hf download "$MODEL_REPO" --local-dir "$MODEL_DIR"
              date -u +'done %Y-%m-%dT%H:%M:%SZ'
              du -sh "$MODEL_DIR"
              ls "$MODEL_DIR"/*.safetensors | wc -l
          volumeMounts:
            - name: models
              mountPath: /models
          resources:
            requests:
              cpu: "12"
              memory: 48Gi
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: fsx-pvc
