#
# Quantizes meta-models/Muse-Glimmer-30B to ModelOpt FP8 on the shared claim. Apply before the muse-glimmer-30b FP8 recipes.
#
# SUBSTITUTE: fsx-pvc.
apiVersion: batch/v1
kind: Job
metadata:
  name: quantize-muse-glimmer-30b-fp8
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      # Runs on the instance type the muse-glimmer-30b recipes serve on.
      nodeSelector:
        node.kubernetes.io/instance-type: "g7e.2xlarge"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: quantizer
          # Runs in the vLLM serving image; the script installs nvidia-modelopt and a transformers that supports muse_glimmer.
          image: vllm/vllm-openai:v0.29.0
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              nvidia-smi --query-gpu=name,memory.total --format=csv,noheader
              # muse_glimmer needs transformers >=5.15; this image ships 5.14.1. Upgrading is safe because the Job runs quantize.py, not vLLM.
              # onnx and accelerate are absent from this image, so they are installed explicitly.
              # Two installs: modelopt caps transformers below 5.15, so one resolution fails; installed in sequence, pip warns and proceeds.
              pip install --quiet --no-cache-dir "nvidia-modelopt[torch,hf]>=0.29.0" accelerate onnx
              pip install --quiet --no-cache-dir "transformers==5.16.1"
              python3 -c "import transformers,modelopt;print('transformers',transformers.__version__,'modelopt',modelopt.__version__)"
              cd /app/src && exec python3 quantize.py
          env:
            - name: MODEL_ID
              value: "meta-models/Muse-Glimmer-30B"
            - name: QUANTIZATION_FORMAT
              value: "fp8"
            # The model carries a perception encoder; the causal_lm auto-class cannot load it.
            - name: MODEL_LOADER
              value: "image_text_to_text"
            # Keep the perception encoder, projector and head in 16-bit. The patterns are broad on purpose:
            # an over-broad match leaves a module in BF16, while a miss quantizes the vision path.
            - name: QUANT_EXCLUDE_PATTERNS
              value: "*vision*,*perception*,*image*,*projector*,*embed*,*lm_head*"
            - name: MODEL_CACHE_DIR
              value: "/models/cache"
            - name: OUTPUT_DIR
              value: "/models/quantized"
            - name: MODELOPT_REAL_EXPORT
              value: "1"
            - name: CALIBRATE
              value: "1"
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: HF_XET_HIGH_PERFORMANCE
              value: "1"
          resources:
            limits:
              nvidia.com/gpu: 1
            requests:
              cpu: "4"
              memory: 20Gi
          volumeMounts:
            - { name: models, mountPath: /models }
            - { name: dshm, mountPath: /dev/shm }
            # Mounts the quantizer source, which the vLLM image does not include.
            - { name: src, mountPath: /app/src }
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: fsx-pvc }
        - name: dshm
          emptyDir: { medium: Memory, sizeLimit: 16Gi }
        - name: src
          configMap: { name: quantizer-src }
