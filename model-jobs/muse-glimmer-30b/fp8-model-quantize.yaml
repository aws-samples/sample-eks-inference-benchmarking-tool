#
# Job that quantizes meta-models/Muse-Glimmer-30B to ModelOpt FP8 and writes it to the shared claim, which the muse-glimmer-30b FP8 recipes serve.
#
# SUBSTITUTE: 012345678901, us-east-1, and fsx-pvc.
apiVersion: batch/v1
kind: Job
metadata:
  name: quantize-muse-glimmer-30b-fp8
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      # Pinned to the serving instance type, so calibration runs on the GPU the result is measured on.
      nodeSelector:
        node.kubernetes.io/instance-type: "g7e.2xlarge"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: quantizer
          # Not the serving-sweep-quantizer image the other quantize Jobs use: that image ships
          # transformers 5.3.0, which predates model_type muse_glimmer (added in 5.15), and its
          # frozen dependency set rejects an in-place upgrade (pip ResolutionImpossible). The
          # serving image already carries a transformers that loads this model, so quantization
          # runs there with nvidia-modelopt installed at start. Slower to boot, but every
          # version in it is one the serving path already trusts.
          image: vllm/vllm-openai:v0.29.0
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              nvidia-smi --query-gpu=name,memory.total --format=csv,noheader
              # v0.29.0 ships transformers 5.14.1; model_type muse_glimmer needs >=5.15.
              # Pinned to the version docs/prompt_tokens measurements were made with. Safe
              # here because this Job runs quantize.py, not vllm. onnx and accelerate are
              # preinstalled in the NGC base the quantizer requirements assume, but absent
              # from this serving image, so they are named explicitly.
              # Two steps, deliberately: modelopt's metadata caps transformers below the version
              # muse_glimmer needs, so a single resolution is ResolutionImpossible. Installed
              # sequentially, pip records the conflict as a warning and proceeds; the cap is
              # conservative metadata, and the quantize path is exercised end to end by the
              # verifier afterward, which is the check that actually matters.
              pip install --quiet --no-cache-dir "nvidia-modelopt[torch,hf]>=0.29.0" accelerate onnx
              pip install --quiet --no-cache-dir "transformers==5.16.1"
              python3 -c "import transformers,modelopt;print('transformers',transformers.__version__,'modelopt',modelopt.__version__)"
              cd /app/src && exec python3 quantize.py
          env:
            - name: MODEL_ID
              value: "meta-models/Muse-Glimmer-30B"
            - name: QUANTIZATION_FORMAT
              value: "fp8"
            # The model carries a perception encoder; the causal_lm auto-class cannot load it.
            - name: MODEL_LOADER
              value: "image_text_to_text"
            # Keep the ViT perception encoder, the projector and the head in 16-bit. The patterns
            # are broad because module names for this architecture are new; an over-broad exclude
            # keeps a module in BF16 (safe), a miss quantizes the vision path (accuracy risk).
            - name: QUANT_EXCLUDE_PATTERNS
              value: "*vision*,*perception*,*image*,*projector*,*embed*,*lm_head*"
            - name: MODEL_CACHE_DIR
              value: "/models/cache"
            - name: OUTPUT_DIR
              value: "/models/quantized"
            - name: MODELOPT_REAL_EXPORT
              value: "1"
            - name: CALIBRATE
              value: "1"
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: HF_XET_HIGH_PERFORMANCE
              value: "1"
          resources:
            limits:
              nvidia.com/gpu: 1
            requests:
              cpu: "4"
              memory: 20Gi
          volumeMounts:
            - { name: models, mountPath: /models }
            - { name: dshm, mountPath: /dev/shm }
            # Overlays this repo's quantizer source on an older image. Drop it once the image is rebuilt from current source.
            - { name: src, mountPath: /app/src }
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: fsx-pvc }
        - name: dshm
          emptyDir: { medium: Memory, sizeLimit: 16Gi }
        - name: src
          configMap: { name: quantizer-src }
