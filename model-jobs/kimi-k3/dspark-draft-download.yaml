#
# Stages the published Inferact/Kimi-K3-DSpark speculator draft (~6.6 GiB) from Hugging Face into S3 for the dspark recipe.
# Apply mxfp4-model-download.yaml first; this Job reuses its kimi-k3-s3-stager ConfigMap, which fails unless every file reached S3.
#
# SUBSTITUTE: WEIGHTS_BUCKET, AWS_REGION, and the ServiceAccount.
apiVersion: batch/v1
kind: Job
metadata:
  name: kimi-k3-dspark-hf-to-s3
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 14400
  template:
    metadata:
      labels:
        app: kimi-k3-dspark-hf-to-s3
    spec:
      restartPolicy: OnFailure
      serviceAccountName: kimi-k3-bench
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: stager
          image: public.ecr.aws/docker/library/python:3.12-slim
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          command: ["bash", "-c"]
          env:
            - name: MODEL_REPO
              value: Inferact/Kimi-K3-DSpark
            - name: WEIGHTS_BUCKET
              value: kimi-k3-model-weights-012345678901-us-east-1
            - name: PREFIX
              value: kimi-k3-dspark
            - name: AWS_REGION
              value: us-east-1
            - name: WORKERS
              value: "8"
            - name: MODEL_DIR
              value: /models/kimi-k3-dspark
            - name: HF_HOME
              value: /models/.hf-cache
            - name: HF_HUB_DISABLE_XET
              value: "1"
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            - name: PYTHONUNBUFFERED
              value: "1"
          args:
            - |
              set -euo pipefail
              pip install --no-cache-dir -q "huggingface_hub==1.28.0" boto3
              exec python3 /opt/stager/stage.py
          volumeMounts:
            - { name: stager, mountPath: /opt/stager }
            - { name: models, mountPath: /models }
          resources:
            requests: { cpu: "4", memory: 16Gi, ephemeral-storage: 50Gi }
            limits: { cpu: "8", memory: 32Gi, ephemeral-storage: 100Gi }
      volumes:
        - name: stager
          configMap: { name: kimi-k3-s3-stager }
        - name: models
          emptyDir: { sizeLimit: 100Gi }
