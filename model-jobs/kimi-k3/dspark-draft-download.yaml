#
# Job that stages the published Inferact/Kimi-K3-DSpark speculator draft from Hugging Face into S3, once, for the dspark recipe. The draft is ~6.6 GiB.
#
# Naming note: the draft is a second model the dspark recipe loads beside the main checkpoint, not a precision of Kimi K3, so it takes its own name rather than a <quant>-model-download.yaml slot.
#
# Reuses the kimi-k3-s3-stager ConfigMap from mxfp4-model-download.yaml, so apply that file first. The stager fails unless every file reached S3.
#
# SUBSTITUTE: WEIGHTS_BUCKET, AWS_REGION, and the IRSA-annotated ServiceAccount.
apiVersion: batch/v1
kind: Job
metadata:
  name: kimi-k3-dspark-hf-to-s3
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 14400
  template:
    metadata:
      labels:
        app: kimi-k3-dspark-hf-to-s3
    spec:
      restartPolicy: OnFailure
      serviceAccountName: kimi-k3-bench
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: stager
          image: public.ecr.aws/docker/library/python:3.12-slim
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          command: ["bash", "-c"]
          env:
            - name: MODEL_REPO
              value: Inferact/Kimi-K3-DSpark
            - name: WEIGHTS_BUCKET
              value: SUBSTITUTE-weights-bucket
            - name: PREFIX
              value: kimi-k3-dspark
            - name: AWS_REGION
              value: us-east-1
            - name: WORKERS
              value: "8"
            - name: SCRATCH
              value: /scratch
            - name: HF_HOME
              value: /scratch/.hf-cache
            - name: HF_HUB_DISABLE_XET
              value: "1"
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            - name: PYTHONUNBUFFERED
              value: "1"
          args:
            - |
              set -euo pipefail
              pip install --no-cache-dir -q "huggingface_hub==1.28.0" boto3
              exec python3 /opt/stager/stage.py
          volumeMounts:
            - { name: stager, mountPath: /opt/stager }
            - { name: scratch, mountPath: /scratch }
          resources:
            requests: { cpu: "4", memory: 16Gi, ephemeral-storage: 50Gi }
            limits: { cpu: "8", memory: 32Gi, ephemeral-storage: 100Gi }
      volumes:
        - name: stager
          configMap: { name: kimi-k3-s3-stager }
        - name: scratch
          emptyDir: { sizeLimit: 100Gi }
