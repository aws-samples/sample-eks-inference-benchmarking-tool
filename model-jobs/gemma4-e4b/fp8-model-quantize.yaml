#
# Job that quantizes google/gemma-4-E4B-it to ModelOpt FP8 and writes it to the shared claim, which the gemma4-e4b FP8 recipes serve. This is the Job that produced the published checkpoint.
#
# SUBSTITUTE: 012345678901, us-east-1, and fsx-pvc.
apiVersion: batch/v1
kind: Job
metadata:
  name: quantize-gemma4-e4b-fp8
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      # Pinned to the instance type that produced the published checkpoint. Calibration is not
      # bit-reproducible, so moving the pin would produce different weights.
      nodeSelector:
        node.kubernetes.io/instance-type: "g7.2xlarge"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: quantizer
          image: 012345678901.dkr.ecr.us-east-1.amazonaws.com/serving-sweep-quantizer:latest
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              nvidia-smi --query-gpu=name,memory.total --format=csv,noheader
              python -c "import transformers,modelopt;print('transformers',transformers.__version__)"
              cd /app/src && exec python quantize.py
          env:
            - name: MODEL_ID
              value: "google/gemma-4-E4B-it"
            - name: QUANTIZATION_FORMAT
              value: "fp8"
            # The default causal_lm auto-class cannot load this checkpoint.
            - name: MODEL_LOADER
              value: "image_text_to_text"
            # The audio patterns are E4B-specific: it carries an audio tower as well as a vision one.
            - name: QUANT_EXCLUDE_PATTERNS
              value: "*vision_tower*,*embed_vision*,*multi_modal_projector*,*vision*,*audio_tower*,*embed_audio*,*audio*,*lm_head*"
            - name: MODEL_CACHE_DIR
              value: "/models/cache"
            - name: OUTPUT_DIR
              value: "/models/quantized"
            - name: MODELOPT_REAL_EXPORT
              value: "1"
            - name: CALIBRATE
              value: "1"
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: HF_XET_HIGH_PERFORMANCE
              value: "1"
          resources:
            limits:
              nvidia.com/gpu: 1
            requests:
              cpu: "4"
              memory: 20Gi
          volumeMounts:
            - { name: models, mountPath: /models }
            - { name: dshm, mountPath: /dev/shm }
            # Overlays this repo's quantizer source on an older image. Drop it once the image is rebuilt from current source.
            - { name: src, mountPath: /app/src }
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: fsx-pvc }
        - name: dshm
          emptyDir: { medium: Memory, sizeLimit: 16Gi }
        - name: src
          configMap: { name: quantizer-src }
