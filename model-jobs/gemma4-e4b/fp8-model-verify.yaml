#
# Checks that a quantized checkpoint on the shared claim matches its own config, and fails if it does not.
#
# SUBSTITUTE: fsx-pvc, CHECKPOINT_DIR, and the two values matching how it was quantized.
apiVersion: batch/v1
kind: Job
metadata:
  name: verify-checkpoint
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      # Needs no GPU or quantizer image; the verifier uses only the Python standard library.
      containers:
        - name: verify
          image: python:3.12-slim
          command: ["python", "/app/verify_checkpoint.py"]
          env:
            - name: CHECKPOINT_DIR
              value: "/models/quantized/gemma-4-E4B-it-fp8"
            - name: QUANTIZATION_FORMAT
              value: "fp8"
            # Must match the exclude patterns used at quantize time, or the exclusion check proves nothing.
            - name: QUANT_EXCLUDE_PATTERNS
              value: "*vision_tower*,*embed_vision*,*multi_modal_projector*,*vision*,*audio_tower*,*embed_audio*,*audio*,*lm_head*"
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "500m"
              memory: 512Mi
          volumeMounts:
            - { name: models, mountPath: /models, readOnly: true }
            - { name: verifier, mountPath: /app }
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: fsx-pvc }
        - name: verifier
          configMap: { name: checkpoint-verifier }
