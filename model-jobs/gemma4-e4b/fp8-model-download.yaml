#
# Loads the ModelOpt FP8 checkpoint from an S3 staging prefix onto the shared claim, in a region that did not produce it.
# Apply after fp8-model-export.yaml writes the prefix. Fails if any file is missing or does not match SHA256SUMS.
#
# The node role needs s3:GetObject and s3:ListBucket on the staging bucket only.
#
# SUBSTITUTE: my-checkpoint-bucket and fsx-pvc.
apiVersion: batch/v1
kind: Job
metadata:
  name: download-gemma4-e4b-fp8
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      # Needs no GPU, only the claim mount.
      containers:
        - name: downloader
          image: public.ecr.aws/aws-cli/aws-cli:latest
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              DEST="${CHECKPOINT_DIR}"
              SRC="s3://${STAGING_BUCKET}/${STAGING_PREFIX}"

              echo "=== downloading ==="
              mkdir -p "$DEST"
              aws s3 sync "$SRC" "$DEST" --only-show-errors
              test -s "$DEST/SHA256SUMS" || { echo "FAIL: no SHA256SUMS in the staging prefix"; exit 1; }

              echo "=== re-hashing every file against the manifest the export wrote ==="
              cd "$DEST"
              # SHA256SUMS does not list itself.
              if ! sha256sum -c SHA256SUMS --quiet 2>/tmp/sha.err; then
                echo "FAIL: checksum mismatch, the copy is not the checkpoint that was exported"
                cat /tmp/sha.err
                exit 1
              fi
              want=$(wc -l < SHA256SUMS)
              echo "  verified $want files"

              echo "=== confirming it is loadable as an FP8 checkpoint ==="
              test -s "$DEST/config.json" || { echo "FAIL: no config.json"; exit 1; }
              grep -q 'quantization_config\|quant_method' "$DEST/config.json" \
                || { echo "FAIL: config.json declares no quantization"; exit 1; }
              shards=$(find . -maxdepth 1 -name '*.safetensors' | wc -l)
              [ "$shards" -gt 0 ] || { echo "FAIL: no .safetensors shards"; exit 1; }
              if [ "$shards" -gt 1 ]; then
                test -s "$DEST/model.safetensors.index.json" || { echo "FAIL: $shards shards but no index"; exit 1; }
              fi
              echo "  shards: $shards"
              du -sh "$DEST" | sed 's/^/  size: /'
              echo "=== checkpoint staged and verified ==="
          env:
            - name: CHECKPOINT_DIR
              value: "/models/quantized/gemma-4-E4B-it-fp8"
            - name: STAGING_BUCKET
              value: "my-checkpoint-bucket"
            - name: STAGING_PREFIX
              value: "gemma-4-E4B-it-fp8"
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - { name: models, mountPath: /models }
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: fsx-pvc }
