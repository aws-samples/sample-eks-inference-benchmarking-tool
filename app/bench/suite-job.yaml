#
# The Kubernetes Job template `main.py launch` renders to run a benchmark, or capture an
# accuracy reference, from inside the cluster. The launcher packs the harness into a
# ConfigMap as a single base64 gzipped tarball, which needs no image build or registry push
# and keeps this manifest independent of which files the harness happens to need, then
# substitutes the double-underscored placeholders below and applies the result. The pod installs
# dependencies, unpacks the code, runs the harness against the server over cluster DNS, and
# returns each result file through stdout markers that the launcher extracts to local disk.
# Running in-cluster keeps the tunnel out of the measurement path: a `kubectl port-forward`
# added roughly 185 ms of setup to every TTFT sample (276 ms first byte on a fresh
# connection against 90 ms warm) and dropped connections mid-run. The pod requests no GPU,
# because the client should not compete with the server it is measuring, and it uses the
# full `python:3.12` image rather than `-slim` because mlcommons-loadgen builds from source.
# Every harness flag travels in one `SUITE_ARGS` string, so adding a flag needs no change
# here; it is expanded unquoted, so the launcher rejects any argument containing whitespace.
# A harness's extra dependencies are installed from a requirements file inside the payload,
# so the version pinned in the repo is the one that runs.
#
apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
  namespace: __NAMESPACE__
  labels: { app: bench-suite }
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app: bench-suite }
    spec:
      restartPolicy: Never
      tolerations:
        - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
        - { key: workload, operator: Exists, effect: NoSchedule }
        - { key: capacity-reservation, operator: Exists, effect: NoSchedule }
      containers:
        - name: runner
          image: python:3.12
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              echo "=== installing harness dependencies ==="
              pip install -q --no-cache-dir aiohttp==3.11.18 mlcommons-loadgen==6.0.17

              echo "=== unpacking harness ==="
              mkdir -p /work/repo
              base64 -d /app/code.tar.gz.b64 | tar xzf - -C /work/repo
              cd /work/repo
              echo "  unpacked: $(find . -type f | wc -l) files"

              if [ -n "${EXTRA_REQUIREMENTS}" ]; then
                echo "=== installing harness extras: ${EXTRA_REQUIREMENTS} ==="
                pip install -q --no-cache-dir -r "${EXTRA_REQUIREMENTS}"
              fi

              echo "=== starting run ==="
              set +e
              python3 -u app/bench/src/main.py ${RUN_COMMAND} ${SUITE_ARGS}
              rc=$?
              set -e

              echo
              for f in $(find /work/out -maxdepth 2 -name '*.txt' 2>/dev/null | sort) \
                       $(find /work/repo/docs/accuracy -maxdepth 1 -name '*.json' 2>/dev/null | sort); do
                case "$f" in
                  /work/out/*) name="${f#/work/out/}" ;;
                  *)           name="docs/accuracy/$(basename "$f")" ;;
                esac
                echo "===== BEGIN RESULT FILE: ${name} ====="
                cat "$f"
                echo "===== END RESULT FILE: ${name} ====="
              done
              echo "=== runner exit code: $rc ==="
              exit $rc
          env:
            - { name: RUN_COMMAND, value: "__RUN_COMMAND__" }
            - { name: SUITE_ARGS, value: "__SUITE_ARGS__" }
            - { name: EXTRA_REQUIREMENTS, value: "__EXTRA_REQUIREMENTS__" }
            - { name: HARNESS_GIT_REV, value: "__HARNESS_GIT_REV__" }
            - { name: PYTHONUNBUFFERED, value: "1" }
          resources:
            # Sized for aiperf, the heaviest client: 16 workers plus 5 service processes
            # reached client_cpu 0.96 of an 8-CPU limit in the 2026-08-10 calibration run.
            requests: { cpu: "8", memory: 8Gi }
            limits:   { cpu: "16", memory: 16Gi }
          volumeMounts:
            - { name: code, mountPath: /app }
            - { name: work, mountPath: /work }
      volumes:
        - name: code
          configMap: { name: __CONFIGMAP__ }
        - name: work
          emptyDir: { sizeLimit: 8Gi }
