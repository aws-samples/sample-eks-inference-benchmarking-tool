#
# Job that checks whether a quantized checkpoint on the shared claim is what its own config claims to be, failing if it is not. Run it against any checkpoint, including one produced before this repository's quantizer existed.
#
# SUBSTITUTE: fsx-pvc, CHECKPOINT_DIR, and the two values matching how it was quantized.
apiVersion: batch/v1
kind: Job
metadata:
  name: verify-checkpoint
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      # No GPU and no quantizer image: the verifier is stdlib-only, so it runs anywhere the claim mounts.
      containers:
        - name: verify
          image: python:3.12-slim
          command: ["python", "/app/verify_checkpoint.py"]
          env:
            - name: CHECKPOINT_DIR
              value: "/models/quantized/gemma-4-E4B-it-fp8"
            - name: QUANTIZATION_FORMAT
              value: "fp8"
            # Must match the patterns the quantize Job used, or the exclusion check is vacuous.
            - name: QUANT_EXCLUDE_PATTERNS
              value: "*vision_tower*,*embed_vision*,*multi_modal_projector*,*vision*,*audio_tower*,*embed_audio*,*audio*,*lm_head*"
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "500m"
              memory: 512Mi
          volumeMounts:
            - { name: models, mountPath: /models, readOnly: true }
            - { name: verifier, mountPath: /app }
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: fsx-pvc }
        - name: verifier
          configMap: { name: checkpoint-verifier }
