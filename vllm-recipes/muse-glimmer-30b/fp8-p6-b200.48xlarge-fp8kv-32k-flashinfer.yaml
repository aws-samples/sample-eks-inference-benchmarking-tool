#
# Muse-Glimmer-30B at FP8 with an FP8 KV cache on ONE B200 GPU of a p6-b200.48xlarge
# (sm_100), 32,768-token context. Premium-silicon sibling of the g7e.2xlarge recipe: same
# single-GPU serving shape, so the pair isolates what the GPU generation buys in TTFT/TPOT
# for a compute-bound model. Single node, no EFA. Serves the checkpoint from S3.
#
# SUBSTITUTE: WEIGHTS_BUCKET and AWS_REGION, in both containers.
---
#
# ATTENTION-BACKEND A/B ARM: identical to fp8-p6-b200.48xlarge-fp8kv-32k.yaml except --attention-backend FLASHINFER
# (and resource names), so the pair isolates the attention kernel. Treat results from this
# file as their own labelled config; never fold them into the TRITON_ATTN baseline.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: muse-glimmer-30b-vllm-b200-fp8kv-32k-flashinfer
  labels: { app: muse-glimmer-30b-vllm-b200-fp8kv-32k-flashinfer }
spec:
  # The S3 weight sync outlasts the 600s default; without this, rollout status reports failure on a healthy load.
  progressDeadlineSeconds: 3600
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: muse-glimmer-30b-vllm-b200-fp8kv-32k-flashinfer }
  template:
    metadata:
      labels: { app: muse-glimmer-30b-vllm-b200-fp8kv-32k-flashinfer }
    spec:
      serviceAccountName: muse-glimmer-30b-bench
      nodeSelector:
        node.kubernetes.io/instance-type: p6-b200.48xlarge
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: fetch-weights
          image: public.ecr.aws/aws-cli/aws-cli:latest
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              aws configure set default.s3.max_concurrent_requests 32
              echo "weights sync start $(date -u)"; df -h /models | tail -1
              aws s3 sync "s3://${WEIGHTS_BUCKET}/${WEIGHTS_PREFIX}/" /models/muse-glimmer-30b-fp8/ \
                --region "${AWS_REGION}" --only-show-errors
              SZ=$(du -s --block-size=1G /models/muse-glimmer-30b-fp8 | cut -f1)
              SHARDS=$(find /models/muse-glimmer-30b-fp8 -name '*.safetensors' | wc -l)
              echo "weights staged ${SZ} GiB, ${SHARDS} shards  $(date -u)"
              test "$SHARDS" -eq 4 || { echo "FATAL: expected 4 shards, got ${SHARDS}" >&2; exit 1; }
              test "$SZ" -ge 28 || { echo "FATAL: expected ~32 GiB, got ${SZ} GiB" >&2; exit 1; }
          env:
            - name: WEIGHTS_BUCKET
              value: SUBSTITUTE-weights-bucket
            - name: WEIGHTS_PREFIX
              value: "muse-glimmer-30b-fp8-quantized"
            - name: AWS_REGION
              value: "us-east-1"
          volumeMounts:
            - { name: models, mountPath: /models }
          resources:
            requests: { cpu: "4", memory: 8Gi }
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.29.0
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              echo "=== starting vLLM on ${INSTANCE_TYPE}: $(date -u) ==="
              vllm serve /models/muse-glimmer-30b-fp8 \
                --served-model-name muse-glimmer-30b \
                --quantization ${QUANTIZATION} \
                --dtype bfloat16 \
                --kv-cache-dtype ${KV_CACHE_DTYPE} \
                --attention-backend ${ATTENTION_BACKEND} \
                --gpu-memory-utilization ${GPU_MEM_UTIL} \
                --max-model-len ${MAX_MODEL_LEN} \
                --max-num-seqs ${MAX_NUM_SEQS} \
                --max-num-batched-tokens ${MAX_NUM_BATCHED_TOKENS} \
                --stream-interval ${STREAM_INTERVAL} \
                --max-cudagraph-capture-size ${MAX_CUDAGRAPH} \
                --async-scheduling \
                --no-enable-prefix-caching \
                --enable-chunked-prefill \
                --port 8000
          ports:
            - containerPort: 8000
          env:
            # ModelOpt export, as on the g7e sibling.
            - name: QUANTIZATION
              value: "modelopt"
            - name: KV_CACHE_DTYPE
              value: "fp8"
            # Pinned for parity with the g7e sibling this recipe is read against.
            - name: ATTENTION_BACKEND
              value: "FLASHINFER"
            - name: MAX_MODEL_LEN
              value: "32768"
            # Held at the g7e sibling's value so the batch ceiling is not a variable.
            - name: MAX_NUM_SEQS
              value: "64"
            - name: MAX_NUM_BATCHED_TOKENS
              value: "32768"
            - name: STREAM_INTERVAL
              value: "10"
            - name: MAX_CUDAGRAPH
              value: "64"
            - name: GPU_MEM_UTIL
              value: "0.90"
            - name: INSTANCE_TYPE
              value: "p6-b200.48xlarge"
            - name: BENCH_CONFIG
              value: "b200-fp8kv-32k-1gpu-flashinfer"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: VLLM_LOGGING_LEVEL
              value: "INFO"
          resources:
            limits:
              nvidia.com/gpu: "1"
              memory: 200Gi
            requests:
              cpu: "10"
              memory: 64Gi
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 15
            failureThreshold: 120
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 30
            failureThreshold: 6
          volumeMounts:
            - { name: models, mountPath: /models }
            - { name: dshm, mountPath: /dev/shm }
      volumes:
        - name: models
          emptyDir: { sizeLimit: 60Gi }
        - name: dshm
          emptyDir: { medium: Memory, sizeLimit: 16Gi }
      terminationGracePeriodSeconds: 120
---
apiVersion: v1
kind: Service
metadata:
  name: muse-glimmer-30b-vllm-b200-fp8kv-32k-flashinfer
spec:
  selector: { app: muse-glimmer-30b-vllm-b200-fp8kv-32k-flashinfer }
  ports:
    - { protocol: TCP, port: 8000, targetPort: 8000 }
