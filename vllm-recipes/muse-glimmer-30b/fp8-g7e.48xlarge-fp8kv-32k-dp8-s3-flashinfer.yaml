# Muse-Glimmer-30B at FP8 with an FP8 KV cache on one g7e.48xlarge: eight single-GPU replicas,
# 32k context, FLASHINFER attention backend. Weights are staged from S3.
# SUBSTITUTE: WEIGHTS_BUCKET and AWS_REGION (the bucket's region) in the init container.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: muse-glimmer-30b-vllm-g7e-48xl-fp8kv-32k-dp8-s3-flashinfer
  labels: { app: muse-glimmer-30b-vllm-g7e-48xl-fp8kv-32k-dp8-s3-flashinfer }
spec:
  # Each replica's S3 weight sync can outlast the 600 s default progress deadline.
  progressDeadlineSeconds: 3600
  # One single-GPU replica per GPU; Recreate keeps a rollout from waiting on a ninth GPU.
  # The Service balances per TCP connection, so load can be uneven at low concurrency.
  replicas: 8
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: muse-glimmer-30b-vllm-g7e-48xl-fp8kv-32k-dp8-s3-flashinfer }
  template:
    metadata:
      labels: { app: muse-glimmer-30b-vllm-g7e-48xl-fp8kv-32k-dp8-s3-flashinfer }
    spec:
      # S3 read access comes from EKS Pod Identity, not the node role.
      serviceAccountName: muse-glimmer-30b-bench
      nodeSelector:
        node.kubernetes.io/instance-type: "g7e.48xlarge"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: fetch-weights
          image: public.ecr.aws/aws-cli/aws-cli:latest
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              aws configure set default.s3.max_concurrent_requests 32
              D=/models/quantized/Muse-Glimmer-30B-fp8
              echo "weights sync start $(date -u)"; df -h /models | tail -1
              aws s3 sync "s3://${WEIGHTS_BUCKET}/${WEIGHTS_PREFIX}/" "$D/" --region "${AWS_REGION}" --only-show-errors
              SHARDS=$(find "$D" -name '*.safetensors' | wc -l)
              SZ=$(du -s --block-size=1G "$D" | cut -f1)
              echo "weights staged ${SZ} GiB, ${SHARDS} shards  $(date -u)"
              test -f "$D/config.json" || { echo "FATAL: no config.json" >&2; exit 1; }
              test "$SHARDS" -eq 4 || { echo "FATAL: expected 4 shards, got ${SHARDS}" >&2; exit 1; }
              test "$SZ" -ge 28 || { echo "FATAL: expected ~32 GiB, got ${SZ} GiB" >&2; exit 1; }
          env:
            - name: WEIGHTS_BUCKET
              value: SUBSTITUTE-weights-bucket
            - name: WEIGHTS_PREFIX
              value: "muse-glimmer-30b-fp8-quantized"
            - name: AWS_REGION
              value: "us-east-1"
          volumeMounts:
            - { name: model-storage, mountPath: /models }
          resources:
            requests: { cpu: "4", memory: 8Gi }
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.29.0
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              echo "=== starting vLLM on ${INSTANCE_TYPE}: $(date -u) ==="
              vllm serve ${MODEL_DIR} \
                --quantization ${QUANTIZATION} \
                --dtype ${DTYPE} \
                --kv-cache-dtype ${KV_CACHE_DTYPE} \
                --attention-backend ${ATTENTION_BACKEND} \
                --gpu-memory-utilization ${GPU_MEM_UTIL} \
                --max-model-len ${MAX_MODEL_LEN} \
                --max-num-seqs ${MAX_NUM_SEQS} \
                --max-num-batched-tokens ${MAX_NUM_BATCHED_TOKENS} \
                --max-cudagraph-capture-size ${MAX_CUDAGRAPH} \
                --async-scheduling \
                --no-enable-prefix-caching \
                --enable-chunked-prefill \
                --port 8000
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_DIR
              value: "/models/quantized/Muse-Glimmer-30B-fp8"
            # ModelOpt FP8 export produced by model-jobs/muse-glimmer-30b/fp8-model-quantize.yaml.
            - name: QUANTIZATION
              value: "modelopt"
            - name: DTYPE
              value: "bfloat16"
            # KV scales are uncalibrated (factor 1.0): vLLM 0.29.0 does not accept --calculate-kv-scales.
            - name: KV_CACHE_DTYPE
              value: "fp8"
            # Passed as --attention-backend because vLLM 0.29.0 ignores VLLM_ATTENTION_BACKEND.
            # FLASH_ATTN does not support an FP8 KV cache on sm_120.
            - name: ATTENTION_BACKEND
              value: "FLASHINFER"
            # Fits the coding_repo_context profile (about 20k prompt tokens plus 1,024 output).
            - name: MAX_MODEL_LEN
              value: "32768"
            # About 60 full-length sequences fit in KV cache; 64 matches MAX_CUDAGRAPH.
            - name: MAX_NUM_SEQS
              value: "64"
            # A full 21k-token prompt prefills in one chunk.
            - name: MAX_NUM_BATCHED_TOKENS
              value: "32768"
            - name: MAX_CUDAGRAPH
              value: "64"
            - name: GPU_MEM_UTIL
              value: "0.95"
            - name: INSTANCE_TYPE
              value: "g7e.48xlarge"
            - name: HF_HOME
              value: "/models"
            - name: PYTHONUNBUFFERED
              value: "1"
            # INFO logs the selected attention backend and KV scale factor at startup.
            - name: VLLM_LOGGING_LEVEL
              value: "INFO"
          resources:
            limits:
              nvidia.com/gpu: 1
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 15
            failureThreshold: 120
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 30
            failureThreshold: 6
          volumeMounts:
            - { name: dshm, mountPath: /dev/shm }
            - { name: model-storage, mountPath: /models }
      volumes:
        # One GPU per pod and no NCCL, so a small bounded /dev/shm is enough.
        - name: dshm
          emptyDir: { medium: Memory, sizeLimit: 16Gi }
        - name: model-storage
          emptyDir: { sizeLimit: 80Gi }
      terminationGracePeriodSeconds: 120
---
apiVersion: v1
kind: Service
metadata:
  name: muse-glimmer-30b-vllm-g7e-48xl-fp8kv-32k-dp8-s3-flashinfer
spec:
  selector: { app: muse-glimmer-30b-vllm-g7e-48xl-fp8kv-32k-dp8-s3-flashinfer }
  ports:
    - { protocol: TCP, port: 8000, targetPort: 8000 }
