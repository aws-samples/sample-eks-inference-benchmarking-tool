#
# Muse-Glimmer-30B at FP8 with an FP8 KV cache on one g7e.24xlarge, tensor parallel 4 over intra-node PCIe (this GPU family has no NVLink), serving a 32,768-token context. Throughput sibling of fp8-g7e.2xlarge-fp8kv-32k.yaml: the single-card recipe is compute-bound at ~0.4 req/s on the coding profile, and this one measures what 4x the FLOPs buys. Single node; no EFA, no multi-node.
#
# 2 KV heads mean TP4 replicates KV 2x across ranks, so the pool grows less than 4x; the
# point of this recipe is FLOPs, not pool. The model was never KV-bound on one card.
#
# SUBSTITUTE: fsx-pvc, if your claim holding /models/quantized/Muse-Glimmer-30B-fp8 is named differently.
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: muse-glimmer-30b-vllm-g7e-24xl-fp8kv-32k-tp4
  labels: { app: muse-glimmer-30b-vllm-g7e-24xl-fp8kv-32k-tp4 }
spec:
  replicas: 1
  # One GPU per node: a rolling update would wait forever on a second pod that cannot schedule.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: muse-glimmer-30b-vllm-g7e-24xl-fp8kv-32k-tp4 }
  template:
    metadata:
      labels: { app: muse-glimmer-30b-vllm-g7e-24xl-fp8kv-32k-tp4 }
    spec:
      nodeSelector:
        node.kubernetes.io/instance-type: "g7e.24xlarge"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.29.0
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              echo "=== starting vLLM on ${INSTANCE_TYPE}: $(date -u) ==="
              vllm serve ${MODEL_DIR} \
                --quantization ${QUANTIZATION} \
                --tensor-parallel-size ${TP_SIZE} \
                --dtype ${DTYPE} \
                --kv-cache-dtype ${KV_CACHE_DTYPE} \
                --attention-backend ${ATTENTION_BACKEND} \
                --gpu-memory-utilization ${GPU_MEM_UTIL} \
                --max-model-len ${MAX_MODEL_LEN} \
                --max-num-seqs ${MAX_NUM_SEQS} \
                --max-num-batched-tokens ${MAX_NUM_BATCHED_TOKENS} \
                --max-cudagraph-capture-size ${MAX_CUDAGRAPH} \
                --async-scheduling \
                --no-enable-prefix-caching \
                --enable-chunked-prefill \
                --port 8000
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_DIR
              value: "/models/quantized/Muse-Glimmer-30B-fp8"
            # Real ModelOpt export (float8_e4m3fn weights, hf_quant_config.json, static
            # input_scale), produced by model-jobs/muse-glimmer-30b/fp8-model-quantize.yaml.
            - name: QUANTIZATION
              value: "modelopt"
            - name: DTYPE
              value: "bfloat16"
            # The KV precision under test. Uncalibrated scales, as on every 0.29.0 FP8-KV recipe
            # here: the engine rejects --calculate-kv-scales and logs "Using KV cache scaling
            # factor 1.0 for fp8_e4m3" at startup, a caveat on any accuracy claim.
            - name: KV_CACHE_DTYPE
              value: "fp8"
            # Pinned so the kernel that served is on record. TRITON_ATTN to match the gemma4-31b
            # 32k recipe this one is read against; the model carries a perception encoder, and on
            # that recipe the engine refused FLASHINFER for the multimodal token pattern and
            # refuses FLASH_ATTN for FP8 KV on sm_120. The deploy script asserts what actually
            # served and fails otherwise.
            # 4 GPUs on one node over PCIe; KV heads replicate (2 heads < 4 ranks).
            - name: TP_SIZE
              value: "4"
            - name: ATTENTION_BACKEND
              value: "TRITON_ATTN"
            # Same window as the gemma4-31b 32k recipe: fits the coding_repo_context profile
            # (20.3k wire median + 1,024 output) with room at the top of its range.
            - name: MAX_MODEL_LEN
              value: "32768"
            # The pool holds roughly 60 full-length sequences at this model's KV geometry
            # (~0.74 GiB per 32k sequence at FP8 across all 52 layers), so 64 is reachable
            # here, unlike on gemma4-31b. Held at 64 to match that recipe and the graph
            # capture ceiling below.
            - name: MAX_NUM_SEQS
              value: "64"
            # A full 21k-token prompt prefills in one chunk. Held at the gemma4-31b value.
            - name: MAX_NUM_BATCHED_TOKENS
              value: "32768"
            - name: MAX_CUDAGRAPH
              value: "64"
            # Held at the gemma4-31b 32k value so memory fraction is not a variable between them.
            - name: GPU_MEM_UTIL
              value: "0.95"
            - name: INSTANCE_TYPE
              value: "g7e.24xlarge"
            - name: HF_HOME
              value: "/models"
            - name: PYTHONUNBUFFERED
              value: "1"
            # INFO so the backend selection and KV-scale lines land in the server log; the deploy
            # script reads both.
            - name: VLLM_LOGGING_LEVEL
              value: "INFO"
          resources:
            limits:
              nvidia.com/gpu: 4
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 15
            failureThreshold: 120
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 30
            failureThreshold: 6
          volumeMounts:
            - { name: dshm, mountPath: /dev/shm }
            - { name: model-storage, mountPath: /models }
      volumes:
        # TP4 shares tensors through /dev/shm; the default emptyDir is too small for 4-way NCCL.
        - name: dshm
          emptyDir: { medium: Memory, sizeLimit: 32Gi }
        - name: model-storage
          persistentVolumeClaim: { claimName: fsx-pvc }
      terminationGracePeriodSeconds: 120
---
apiVersion: v1
kind: Service
metadata:
  name: muse-glimmer-30b-vllm-g7e-24xl-fp8kv-32k-tp4
spec:
  selector: { app: muse-glimmer-30b-vllm-g7e-24xl-fp8kv-32k-tp4 }
  ports:
    - { protocol: TCP, port: 8000, targetPort: 8000 }
