# Qwen3-30B-A3B at FP8 on one g7e.12xlarge, 2 GPUs, tensor parallel 2 with expert parallelism,
# NCCL default transport selection.
# SUBSTITUTE: kubernetes.io/hostname, WEIGHTS_BUCKET and AWS_REGION in the init container, and the Pod Identity
# association for qwen3-30b-a3b-bench. All arms of this study must pin the SAME node.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-30b-a3b-g7e12-switch-default
  labels:
    app: qwen3-30b-a3b-g7e12-switch-default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qwen3-30b-a3b-g7e12-switch-default
  template:
    metadata:
      labels:
        app: qwen3-30b-a3b-g7e12-switch-default
    spec:
      serviceAccountName: qwen3-30b-a3b-bench
      nodeSelector:
        kubernetes.io/hostname: SUBSTITUTE-gpu-node
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: workload
          operator: Equal
          value: bench
          effect: NoSchedule
        - key: capacity-reservation
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: fetch-weights
          image: public.ecr.aws/aws-cli/aws-cli:latest
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              aws configure set default.s3.max_concurrent_requests 64
              aws configure set default.s3.multipart_chunksize 64MB
              aws configure set default.s3.max_queue_size 10000
              echo "weights sync start $(date -u)"; df -h /models | tail -1
              # The emptyDir must be on the NVMe instance store; stop if it lacks the space.
              avail=$(df -Pk /models | awk 'NR==2 {print int($4/1048576)}')
              if [ "$avail" -lt "$MIN_FREE_GIB" ]; then
                echo "FATAL: ${avail} GiB free at /models, need ${MIN_FREE_GIB} GiB." >&2
                echo "  If that is a root disk rather than the NVMe array, this node's ephemeral" >&2
                echo "  storage is not on the instance store and the sync would fill it." >&2
                exit 1
              fi
              aws s3 sync "s3://${WEIGHTS_BUCKET}/${WEIGHTS_PREFIX}/" /models/qwen3-30b-a3b-fp8/ \
                --region "${AWS_REGION}" --only-show-errors --exclude ".cache/*"
              SZ=$(du -s --block-size=1G /models/qwen3-30b-a3b-fp8 | cut -f1)
              SHARDS=$(find /models/qwen3-30b-a3b-fp8 -maxdepth 1 -name '*.safetensors' | wc -l)
              echo "weights staged ${SZ} GiB, ${SHARDS} shards  $(date -u)"
              test "$SZ" -ge 28 || { echo "FATAL: expected ~31 GiB, got ${SZ} GiB" >&2; exit 1; }
              test "$SHARDS" -eq 7 || { echo "FATAL: expected 7 shards, got ${SHARDS}" >&2; exit 1; }
          env:
            - name: MIN_FREE_GIB
              value: "40"
            - name: WEIGHTS_BUCKET
              value: qwen3-30b-a3b-model-weights-012345678901-us-east-1
            - name: WEIGHTS_PREFIX
              value: "qwen3-30b-a3b-fp8"
            - name: AWS_REGION
              value: "us-east-1"
          volumeMounts:
            - { name: models, mountPath: /models }
          resources:
            requests: { cpu: "8", memory: 16Gi }
            limits: { cpu: "16", memory: 32Gi }
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.26.0
          securityContext:
            capabilities:
              add:
                - IPC_LOCK
          command:
            - bash
            - -lc
          args:
            - |
              set -euo pipefail
              python3 - <<'PY' || echo "version probe failed"
              from importlib.metadata import version
              import torch
              print(f"vLLM={version('vllm')}")
              print(f"PyTorch={torch.__version__}")
              print(f"PyTorch CUDA={torch.version.cuda}")
              print(f"NCCL={torch.cuda.nccl.version()}")
              PY
              nvidia-smi --query-gpu=index,uuid,name,memory.total,pci.bus_id,driver_version \
                --format=csv,noheader
              nvidia-smi topo -m
              env | grep -E '^NCCL_(P2P_LEVEL|P2P_DISABLE)=' \
                || echo "NCCL transport overrides: none"
              exec vllm serve /models/qwen3-30b-a3b-fp8 \
                --served-model-name qwen3-30b-a3b-fp8 \
                --kv-cache-dtype bfloat16 \
                --tensor-parallel-size 2 \
                --enable-expert-parallel \
                --all2all-backend allgather_reducescatter \
                --gpu-memory-utilization 0.90 \
                --max-model-len 8192 \
                --max-num-seqs 512 \
                --max-num-batched-tokens 8192 \
                --async-scheduling \
                --enable-chunked-prefill \
                --no-enable-prefix-caching \
                --port 8000
          env:
            - name: CUDA_DEVICE_ORDER
              value: "PCI_BUS_ID"
            - name: HF_HOME
              value: "/models/.hf-cache"
            - name: VLLM_LOGGING_LEVEL
              value: "WARNING"
            - name: NCCL_DEBUG
              value: "INFO"
            - name: NCCL_DEBUG_SUBSYS
              value: "INIT,GRAPH,P2P,NET"
          ports:
            - containerPort: 8000
          resources:
            requests:
              nvidia.com/gpu: "2"
            limits:
              nvidia.com/gpu: "2"
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            failureThreshold: 6
          volumeMounts:
            - name: models
              mountPath: /models
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: models
          emptyDir: { sizeLimit: 100Gi }
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
      terminationGracePeriodSeconds: 120
---
apiVersion: v1
kind: Service
metadata:
  name: qwen3-30b-a3b-g7e12-switch-default
spec:
  selector:
    app: qwen3-30b-a3b-g7e12-switch-default
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
