# Gemma 4 31B at FP8 with an FP8 KV cache on one p6-b200.48xlarge: eight single-GPU replicas,
# 32k context, text-only, FlashInfer attention. Weights are staged from S3.
# SUBSTITUTE: WEIGHTS_BUCKET and AWS_REGION in the init container.
---
# --language-model-only disables multimodal inputs, which FlashInfer requires for this model,
# and skips the vision encoder.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemma4-31b-vllm-b200-fp8kv-32k-dp8-textonly-flashinfer
  labels: { app: gemma4-31b-vllm-b200-fp8kv-32k-dp8-textonly-flashinfer }
spec:
  # The S3 weight sync outlasts the 600 s default progress deadline.
  progressDeadlineSeconds: 3600
  # One single-GPU replica per GPU; the Service load-balances across them.
  replicas: 8
  selector:
    matchLabels: { app: gemma4-31b-vllm-b200-fp8kv-32k-dp8-textonly-flashinfer }
  template:
    metadata:
      labels: { app: gemma4-31b-vllm-b200-fp8kv-32k-dp8-textonly-flashinfer }
    spec:
      serviceAccountName: gemma4-31b-bench
      nodeSelector:
        node.kubernetes.io/instance-type: p6-b200.48xlarge
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: fetch-weights
          image: public.ecr.aws/aws-cli/aws-cli:latest
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              aws configure set default.s3.max_concurrent_requests 32
              echo "weights sync start $(date -u)"; df -h /models | tail -1
              aws s3 sync "s3://${WEIGHTS_BUCKET}/${WEIGHTS_PREFIX}/" /models/gemma4-31b-fp8/ \
                --region "${AWS_REGION}" --only-show-errors
              SZ=$(du -s --block-size=1G /models/gemma4-31b-fp8 | cut -f1)
              echo "weights staged ${SZ} GiB  $(date -u)"
              test "$SZ" -ge 25 || { echo "FATAL: expected ~30 GiB, got ${SZ} GiB" >&2; exit 1; }
              test -f /models/gemma4-31b-fp8/config.json || { echo "FATAL: no config.json" >&2; exit 1; }
          env:
            - name: WEIGHTS_BUCKET
              value: SUBSTITUTE-weights-bucket
            - name: WEIGHTS_PREFIX
              value: "gemma4-31b-fp8-quantized"
            - name: AWS_REGION
              value: "us-east-1"
          volumeMounts:
            - { name: models, mountPath: /models }
          resources:
            requests: { cpu: "4", memory: 8Gi }
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.29.0
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              echo "=== starting vLLM replica on ${INSTANCE_TYPE}: $(date -u) ==="
              vllm serve /models/gemma4-31b-fp8 \
                --language-model-only \
                --served-model-name gemma4-31b \
                --quantization ${QUANTIZATION} \
                --dtype bfloat16 \
                --kv-cache-dtype ${KV_CACHE_DTYPE} \
                --attention-backend ${ATTENTION_BACKEND} \
                --gpu-memory-utilization ${GPU_MEM_UTIL} \
                --max-model-len ${MAX_MODEL_LEN} \
                --max-num-seqs ${MAX_NUM_SEQS} \
                --max-num-batched-tokens ${MAX_NUM_BATCHED_TOKENS} \
                --stream-interval ${STREAM_INTERVAL} \
                --max-cudagraph-capture-size ${MAX_CUDAGRAPH} \
                --async-scheduling \
                --no-enable-prefix-caching \
                --enable-chunked-prefill \
                --port 8000
          ports:
            - containerPort: 8000
          env:
            # The checkpoint is a ModelOpt export; the plain fp8 loader does not read it correctly.
            - name: QUANTIZATION
              value: "modelopt"
            - name: KV_CACHE_DTYPE
              value: "fp8"
            - name: ATTENTION_BACKEND
              value: "FLASHINFER"
            - name: MAX_MODEL_LEN
              value: "32768"
            # About 14 full-length sequences fit in KV cache per GPU.
            - name: MAX_NUM_SEQS
              value: "16"
            - name: MAX_NUM_BATCHED_TOKENS
              value: "32768"
            - name: STREAM_INTERVAL
              value: "10"
            - name: MAX_CUDAGRAPH
              value: "16"
            - name: GPU_MEM_UTIL
              value: "0.90"
            - name: INSTANCE_TYPE
              value: "p6-b200.48xlarge"
            - name: BENCH_CONFIG
              value: "b200-fp8kv-32k-dp8-textonly-flashinfer"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: VLLM_LOGGING_LEVEL
              value: "INFO"
          resources:
            limits:
              nvidia.com/gpu: "1"
              memory: 200Gi
            requests:
              cpu: "10"
              memory: 64Gi
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 15
            failureThreshold: 120
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 30
            failureThreshold: 6
          volumeMounts:
            - { name: models, mountPath: /models }
            - { name: dshm, mountPath: /dev/shm }
      volumes:
        - name: models
          emptyDir: { sizeLimit: 60Gi }
        - name: dshm
          emptyDir: { medium: Memory, sizeLimit: 16Gi }
      terminationGracePeriodSeconds: 120
---
apiVersion: v1
kind: Service
metadata:
  name: gemma4-31b-vllm-b200-fp8kv-32k-dp8-textonly-flashinfer
spec:
  selector: { app: gemma4-31b-vllm-b200-fp8kv-32k-dp8-textonly-flashinfer }
  ports:
    - { protocol: TCP, port: 8000, targetPort: 8000 }
