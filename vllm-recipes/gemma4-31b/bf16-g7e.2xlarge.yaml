#
# Gemma 4 31B at BF16 on one g7e.2xlarge, a single GPU. Use this when g7e.4xlarge is unavailable and one large GPU is enough; downloads its own weights, no FSx in this AZ.
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemma4-31b-vllm-g7e-2xl-bf16
  labels: { app: gemma4-31b-vllm-g7e-2xl-bf16 }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: gemma4-31b-vllm-g7e-2xl-bf16 }
  template:
    metadata:
      labels: { app: gemma4-31b-vllm-g7e-2xl-bf16 }
    spec:
      nodeSelector:
        node.kubernetes.io/instance-type: "g7e.2xlarge"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: fetch-weights
          image: python:3.12-slim
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              echo "=== disk before ==="; df -h "$MOUNT_ROOT"

              # emptyDir lands wherever kubelet's root is, not necessarily the instance store.
              avail=$(df -Pk "$MOUNT_ROOT" | awk 'NR==2 {print int($4/1048576)}')
              if [ "$avail" -lt "$MIN_FREE_GIB" ]; then
                echo "FATAL: ${avail} GiB free at $MOUNT_ROOT, need ${MIN_FREE_GIB} GiB." >&2
                exit 1
              fi

              if [ -f "$MODEL_DIR/model.safetensors.index.json" ]; then
                WANT=$(grep -o 'model-[0-9]\{5\}-of-[0-9]\{5\}' \
                       "$MODEL_DIR/model.safetensors.index.json" | sort -u | wc -l)
                HAVE=$(ls "$MODEL_DIR"/*.safetensors 2>/dev/null | wc -l)
                PART=$(find "$MODEL_DIR" -name '*.incomplete' 2>/dev/null | wc -l)
                if [ "$HAVE" -eq "$WANT" ] && [ "$PART" -eq 0 ]; then
                  echo "checkpoint already staged: $HAVE/$WANT shards, none partial"
                  exit 0
                fi
                echo "partial checkpoint ($HAVE/$WANT, $PART partial), resuming"
              fi

              pip install --no-cache-dir -q "huggingface_hub==$HF_HUB_VERSION"
              mkdir -p "$MODEL_DIR" "$HF_HOME"

              echo "=== downloading $MODEL_REPO $(date -u) ==="
              hf download "$MODEL_REPO" --local-dir "$MODEL_DIR"
              echo "=== complete $(date -u) ==="

              WANT=$(grep -o 'model-[0-9]\{5\}-of-[0-9]\{5\}' \
                     "$MODEL_DIR/model.safetensors.index.json" | sort -u | wc -l)
              HAVE=$(ls "$MODEL_DIR"/*.safetensors | wc -l)
              PART=$(find "$MODEL_DIR" -name '*.incomplete' | wc -l)
              echo "shards $HAVE/$WANT, incomplete $PART"
              { [ "$HAVE" -eq "$WANT" ] && [ "$PART" -eq 0 ]; } \
                || { echo "FATAL: incomplete checkpoint" >&2; exit 1; }
              du -sh "$MODEL_DIR"; df -h "$MOUNT_ROOT"
          env:
            - name: MODEL_REPO
              value: google/gemma-4-31b-it
            - name: MODEL_DIR
              value: /models/gemma-4-31b-it
            - name: MOUNT_ROOT
              value: /models
            - name: MIN_FREE_GIB
              value: "70"
            - name: HF_HOME
              value: /models/.hf-cache
            - name: HF_XET_HIGH_PERFORMANCE
              value: "1"
            - name: HF_HUB_VERSION
              value: "1.28.0"
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef: { name: hf-token, key: token }
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - { name: model-storage, mountPath: /models }
          resources:
            requests: { cpu: "4", memory: 16Gi }
            limits: { cpu: "8", memory: 32Gi }
      containers:
        - name: vllm
          image: public.ecr.aws/deep-learning-containers/vllm:0.21.0-gpu-py312
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              echo "=== starting vLLM on ${INSTANCE_TYPE}: $(date -u) ==="
              vllm serve ${MODEL_DIR} \
                --gpu-memory-utilization ${GPU_MEM_UTIL} \
                --max-model-len ${MAX_MODEL_LEN} \
                --max-num-seqs ${MAX_NUM_SEQS} \
                --max-num-batched-tokens ${MAX_NUM_BATCHED_TOKENS} \
                --enable-prefix-caching \
                --enable-chunked-prefill \
                --port 8000
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_DIR
              value: "/models/gemma-4-31b-it"
            - name: MAX_MODEL_LEN
              value: "8192"
            - name: MAX_NUM_SEQS
              value: "512"
            - name: MAX_NUM_BATCHED_TOKENS
              value: "32768"
            - name: GPU_MEM_UTIL
              value: "0.95"
            - name: INSTANCE_TYPE
              value: "g7e.2xlarge"
            - name: HF_HOME
              value: "/models"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: VLLM_ATTENTION_BACKEND
              value: "FLASHINFER"
            - name: VLLM_LOGGING_LEVEL
              value: "WARNING"
          resources:
            limits:
              nvidia.com/gpu: 1
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 15
            failureThreshold: 120
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 30
            failureThreshold: 6
          volumeMounts:
            - { name: dshm, mountPath: /dev/shm }
            - { name: model-storage, mountPath: /models }
            - { name: sitecustomize, mountPath: /usr/local/lib/python3.12/dist-packages/sitecustomize.py, subPath: sitecustomize.py }
      volumes:
        - name: dshm
          emptyDir: { medium: Memory }
        - name: model-storage
          emptyDir: { sizeLimit: 100Gi }
        - name: sitecustomize
          configMap: { name: vllm-sitecustomize }
      terminationGracePeriodSeconds: 120
---
apiVersion: v1
kind: Service
metadata:
  name: gemma4-31b-vllm-g7e-2xl-bf16
spec:
  selector: { app: gemma4-31b-vllm-g7e-2xl-bf16 }
  ports:
    - { protocol: TCP, port: 8000, targetPort: 8000 }
