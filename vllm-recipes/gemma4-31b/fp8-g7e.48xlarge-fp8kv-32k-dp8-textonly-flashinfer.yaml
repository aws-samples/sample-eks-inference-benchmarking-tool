#
# Gemma 4 31B at FP8 with an FP8 KV cache as EIGHT independent single-GPU replicas on one
# g7e.48xlarge (8x RTX PRO 6000 Blackwell, sm_120, PCIe), 32,768-token context each, text-only.
# Per-replica serving values are identical to fp8-g7e.2xlarge-fp8kv-32k.yaml (the single-card
# baseline) except --language-model-only, so per-card figures compare with it directly. Weights
# are synced from S3 onto the node's local NVMe (the nodegroup must mount the instance store as
# pod storage; see k8s/examples/nodeconfig-local-nvme-raid0.yaml). Single node, no EFA.
#
# --language-model-only sets every image/video limit to 0, which turns off vLLM's mm_prefix
# attention mode (config/model.py) and so lifts the 'partial multimodal token full attention'
# refusal that blocks FLASHINFER for this model. The coding workload is text-only, so this is a
# production-valid setting. It also skips the vision encoder, which frees memory for KV cache:
# compare text-only arms with each other, not with the multimodal TRITON_ATTN baseline.
#
# SUBSTITUTE: WEIGHTS_BUCKET and AWS_REGION (the bucket's region) in the init container.
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemma4-31b-vllm-g7e-48xl-fp8kv-32k-dp8-textonly-flashinfer
  labels: { app: gemma4-31b-vllm-g7e-48xl-fp8kv-32k-dp8-textonly-flashinfer }
spec:
  # Each replica syncs ~30 GiB from S3 before vLLM starts; allow for it beyond the 600s default.
  progressDeadlineSeconds: 3600
  # Eight single-GPU pods fill the node's eight GPUs; Recreate so an update never waits on a ninth.
  replicas: 8
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: gemma4-31b-vllm-g7e-48xl-fp8kv-32k-dp8-textonly-flashinfer }
  template:
    metadata:
      labels: { app: gemma4-31b-vllm-g7e-48xl-fp8kv-32k-dp8-textonly-flashinfer }
    spec:
      # Pod-scoped S3 read via EKS Pod Identity; these nodes block pod IMDS (hop limit 1).
      serviceAccountName: gemma4-31b-bench
      nodeSelector:
        node.kubernetes.io/instance-type: "g7e.48xlarge"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: fetch-weights
          image: public.ecr.aws/aws-cli/aws-cli:latest
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              aws configure set default.s3.max_concurrent_requests 32
              D=/models/quantized/gemma-4-31b-it-fp8
              echo "weights sync start $(date -u)"; df -h /models | tail -1
              aws s3 sync "s3://${WEIGHTS_BUCKET}/${WEIGHTS_PREFIX}/" "$D/" --region "${AWS_REGION}" --only-show-errors
              SZ=$(du -s --block-size=1G "$D" | cut -f1)
              echo "weights staged ${SZ} GiB  $(date -u)"
              test -f "$D/config.json" || { echo "FATAL: no config.json" >&2; exit 1; }
              test "$SZ" -ge 25 || { echo "FATAL: expected ~30 GiB, got ${SZ} GiB" >&2; exit 1; }
          env:
            - name: WEIGHTS_BUCKET
              value: SUBSTITUTE-weights-bucket
            - name: WEIGHTS_PREFIX
              value: "gemma4-31b-fp8-quantized"
            - name: AWS_REGION
              value: "us-east-1"
          volumeMounts:
            - { name: model-storage, mountPath: /models }
          resources:
            requests: { cpu: "4", memory: 8Gi }
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.29.0
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              echo "=== starting vLLM on ${INSTANCE_TYPE}: $(date -u) ==="
              vllm serve ${MODEL_DIR} \
                --language-model-only \
                --quantization ${QUANTIZATION} \
                --dtype ${DTYPE} \
                --kv-cache-dtype ${KV_CACHE_DTYPE} \
                --attention-backend ${ATTENTION_BACKEND} \
                --gpu-memory-utilization ${GPU_MEM_UTIL} \
                --max-model-len ${MAX_MODEL_LEN} \
                --max-num-seqs ${MAX_NUM_SEQS} \
                --max-num-batched-tokens ${MAX_NUM_BATCHED_TOKENS} \
                --max-cudagraph-capture-size ${MAX_CUDAGRAPH} \
                --async-scheduling \
                --no-enable-prefix-caching \
                --enable-chunked-prefill \
                --port 8000
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_DIR
              value: "/models/quantized/gemma-4-31b-it-fp8"
            # The checkpoint is a real ModelOpt export (float8_e4m3fn weights, hf_quant_config.json,
            # static input_scale). The vanilla "fp8" loader mis-reads it and produces garbage.
            - name: QUANTIZATION
              value: "modelopt"
            - name: DTYPE
              value: "bfloat16"
            # The KV precision under test. "auto" resolves through DTYPE to BF16, which is what the
            # 8k sibling serves. No --calculate-kv-scales: v0.29.0 rejects the flag, so the server
            # runs uncalibrated and logs "Using KV cache scaling factor 1.0 for fp8_e4m3" at
            # startup. That is a caveat on any accuracy claim taken from this recipe.
            - name: KV_CACHE_DTYPE
              value: "fp8"
            # Pinned rather than auto-selected so the kernel that served is on record; no result
            # file captures it otherwise. TRITON_ATTN is the only backend this configuration can
            # run, so the pin documents rather than chooses: the engine refuses FLASHINFER for
            # this model ("partial multimodal token full attention not supported"; Gemma 4 31B
            # carries a vision tower), and refuses FLASH_ATTN for the FP8 KV cache on sm_120
            # ("FP8 KV cache requires FA3 on SM90 or FA4 on SM100"). Both refusals observed on
            # this image at deploy time.
            - name: ATTENTION_BACKEND
              value: "FLASHINFER"
            # The context under test. The 8k sibling caps at 8192; this serves the largest window
            # the coding_repo_context profile needs (20.3k wire input + 1024 output on this
            # tokenizer) with room for prompts at the top of its range.
            - name: MAX_MODEL_LEN
              value: "32768"
            # At 30k tokens per sequence the 47 GiB pool holds about 16 sequences at FP8 KV, so
            # 512 is unreachable and graph capture at 512 only spends memory. 64 covers the pool
            # with margin for shorter requests and is the graph capture ceiling below.
            - name: MAX_NUM_SEQS
              value: "64"
            # Large enough that a full 21k-token prompt prefills in one chunk. Held at the 8k
            # sibling's value.
            - name: MAX_NUM_BATCHED_TOKENS
              value: "32768"
            - name: MAX_CUDAGRAPH
              value: "64"
            # Held at the 8k sibling's value so memory fraction is not a variable between them.
            - name: GPU_MEM_UTIL
              value: "0.95"
            - name: INSTANCE_TYPE
              value: "g7e.48xlarge"
            - name: HF_HOME
              value: "/models"
            - name: PYTHONUNBUFFERED
              value: "1"
            # INFO so the backend selection and KV-scale lines land in the server log; the deploy
            # script reads both.
            - name: VLLM_LOGGING_LEVEL
              value: "INFO"
          resources:
            limits:
              nvidia.com/gpu: 1
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 15
            failureThreshold: 120
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 30
            failureThreshold: 6
          volumeMounts:
            - { name: dshm, mountPath: /dev/shm }
            - { name: model-storage, mountPath: /models }
      volumes:
        - name: dshm
          emptyDir: { medium: Memory }
        # Pod-local, on the node's NVMe instance store when the nodegroup mounts it (see header).
        - name: model-storage
          emptyDir: { sizeLimit: 60Gi }
      terminationGracePeriodSeconds: 120
---
apiVersion: v1
kind: Service
metadata:
  name: gemma4-31b-vllm-g7e-48xl-fp8kv-32k-dp8-textonly-flashinfer
spec:
  selector: { app: gemma4-31b-vllm-g7e-48xl-fp8kv-32k-dp8-textonly-flashinfer }
  ports:
    - { protocol: TCP, port: 8000, targetPort: 8000 }
