# Qwen2.5-7B-Instruct at ModelOpt FP8 on one GPU of a g6e.12xlarge, with a 16-bit KV cache: the checkpoint
# carries no KV scales, and an FP8 KV cache without them fails the accuracy gate. An init container
# quantizes the model to FP8 onto the node's NVMe emptyDir at /models on first start, and vLLM serves from
# it; no FSx claim or S3 is involved, and a pod restart simply re-quantizes.
# SUBSTITUTE: 012345678901 and us-east-1 in the quantizer image reference (the deploy script fills these).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen7b-vllm-g6e-12xl-fp8
  labels: { app: qwen7b-vllm-g6e-12xl-fp8 }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: qwen7b-vllm-g6e-12xl-fp8 }
  template:
    metadata:
      labels: { app: qwen7b-vllm-g6e-12xl-fp8 }
    spec:
      nodeSelector:
        node.kubernetes.io/instance-type: "g6e.12xlarge"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      initContainers:
        # Quantizes Qwen2.5-7B to ModelOpt FP8 onto the shared /models emptyDir, then exits and hands
        # the GPU to vLLM. quantize.py fails the pod if the export does not verify.
        - name: quantize
          image: 012345678901.dkr.ecr.us-east-1.amazonaws.com/serving-sweep-quantizer:latest
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              nvidia-smi --query-gpu=name,memory.total --format=csv,noheader
              cd /app/src && exec python quantize.py
          env:
            - name: MODEL_ID
              value: "Qwen/Qwen2.5-7B-Instruct"
            - name: QUANTIZATION_FORMAT
              value: "fp8"
            - name: MODEL_CACHE_DIR
              value: "/models/cache"
            - name: OUTPUT_DIR
              value: "/models/quantized"
            - name: MODELOPT_REAL_EXPORT
              value: "1"
            - name: CALIBRATE
              value: "1"
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef: { name: hf-token, key: token }
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            limits:
              nvidia.com/gpu: 1
            requests:
              cpu: "4"
              memory: 20Gi
          volumeMounts:
            - { name: model-storage, mountPath: /models }
            - { name: dshm, mountPath: /dev/shm }
      containers:
        - name: vllm
          image: public.ecr.aws/deep-learning-containers/vllm:0.21.0-gpu-py312
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              echo "=== starting vLLM on ${INSTANCE_TYPE}: $(date -u) ==="
              vllm serve ${MODEL_DIR} \
                --quantization ${QUANTIZATION} \
                --tensor-parallel-size ${TP_SIZE} \
                --gpu-memory-utilization ${GPU_MEM_UTIL} \
                --max-num-seqs ${MAX_NUM_SEQS} \
                --max-num-batched-tokens ${MAX_NUM_BATCHED_TOKENS} \
                --no-enable-prefix-caching \
                --enable-chunked-prefill \
                --port 8000
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_DIR
              value: "/models/quantized/Qwen2.5-7B-Instruct-fp8"
            - name: TP_SIZE
              value: "1"
            - name: MAX_NUM_SEQS
              value: "512"
            - name: MAX_NUM_BATCHED_TOKENS
              value: "32768"
            - name: GPU_MEM_UTIL
              value: "0.95"
            - name: QUANTIZATION
              value: "modelopt"
            - name: INSTANCE_TYPE
              value: "g6e.12xlarge"
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef: { name: hf-token, key: token }
            - name: HF_HOME
              value: "/models"
            # INFO logs the KV cache size and prefix cache hit rate the provenance block reads.
            - name: VLLM_LOGGING_LEVEL
              value: "INFO"
          resources:
            limits:
              nvidia.com/gpu: 1
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 15
            failureThreshold: 120
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 30
            failureThreshold: 6
          volumeMounts:
            - { name: dshm, mountPath: /dev/shm }
            - { name: model-storage, mountPath: /models }
      volumes:
        - name: dshm
          emptyDir: { medium: Memory }
        # Node-local NVMe (the RAID0 instance store provision-capacity.sh sets up); holds the base
        # download plus the quantized checkpoint, and is discarded with the pod.
        - name: model-storage
          emptyDir: { sizeLimit: 100Gi }
      terminationGracePeriodSeconds: 120
---
apiVersion: v1
kind: Service
metadata:
  name: qwen7b-vllm-g6e-12xl-fp8
spec:
  selector: { app: qwen7b-vllm-g6e-12xl-fp8 }
  ports:
    - { protocol: TCP, port: 8000, targetPort: 8000 }
