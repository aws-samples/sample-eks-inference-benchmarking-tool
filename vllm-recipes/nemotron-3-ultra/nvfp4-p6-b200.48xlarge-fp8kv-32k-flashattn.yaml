#
# Nemotron 3 Ultra 550B A55B at NVFP4 on one p6-b200.48xlarge (8x B200 180 GB, sm_100), tensor
# parallel 8, FP8 KV cache, 32,768-token context, attention backend pinned to TRITON_ATTN.
# On Blackwell the NVFP4 checkpoint runs the native cutlass W4A4 GEMM path. Results from this
# recipe are NOT comparable to a Hopper run, which would use the FP4-Marlin W4A16 fallback.
#
# SUBSTITUTE: WEIGHTS_BUCKET and AWS_REGION, in both containers.
---
#
# ATTENTION-BACKEND A/B ARM: identical to nvfp4-p6-b200.48xlarge-fp8kv-32k.yaml except --attention-backend FLASH_ATTN
# (and resource names). On B200 this build selects FlashAttention 4, which accepts an FP8 KV
# cache at head size 128 (checked on the B200 with FlashAttentionBackend.validate_configuration).
# Treat results as their own labelled config; never fold them into the TRITON_ATTN baseline.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nemotron-3-ultra-vllm-b200-fp8kv-32k-flashattn
  labels: { app: nemotron-3-ultra-vllm-b200-fp8kv-32k-flashattn }
spec:
  # The S3 weight sync outlasts the 600s default; without this, rollout status reports failure on a healthy load.
  progressDeadlineSeconds: 7200
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: nemotron-3-ultra-vllm-b200-fp8kv-32k-flashattn }
  template:
    metadata:
      labels: { app: nemotron-3-ultra-vllm-b200-fp8kv-32k-flashattn }
    spec:
      serviceAccountName: nemotron-3-ultra-bench
      nodeSelector:
        node.kubernetes.io/instance-type: p6-b200.48xlarge
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: fetch-weights
          image: public.ecr.aws/aws-cli/aws-cli:latest
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              aws configure set default.s3.max_concurrent_requests 64
              aws configure set default.s3.multipart_chunksize 64MB
              aws configure set default.s3.max_queue_size 10000

              echo "weights sync start $(date -u)"; df -h /models | tail -1
              # An emptyDir lands wherever kubelet's root is, which is not always the instance store.
              # Check the space is really here before pulling a checkpoint this size onto a root disk.
              avail=$(df -Pk /models | awk 'NR==2 {print int($4/1048576)}')
              if [ "$avail" -lt "$MIN_FREE_GIB" ]; then
                echo "FATAL: ${avail} GiB free at /models, need ${MIN_FREE_GIB} GiB." >&2
                echo "  If that is a root disk rather than the NVMe array, this node's ephemeral" >&2
                echo "  storage is not on the instance store and the sync would fill it." >&2
                exit 1
              fi

              aws s3 sync "s3://${WEIGHTS_BUCKET}/${WEIGHTS_PREFIX}/" /models/nemotron-3-ultra-nvfp4/ \
                --region "${AWS_REGION}" --only-show-errors
              SZ=$(du -s --block-size=1G /models/nemotron-3-ultra-nvfp4 | cut -f1)
              SHARDS=$(find /models/nemotron-3-ultra-nvfp4 -name '*.safetensors' | wc -l)
              echo "weights staged ${SZ} GiB, ${SHARDS} shards  $(date -u)"
              test "$SZ" -ge 300 || { echo "FATAL: expected ~328 GiB, got ${SZ} GiB" >&2; exit 1; }
              test "$SHARDS" -eq 113 || { echo "FATAL: expected 113 shards, got ${SHARDS}" >&2; exit 1; }
          env:
            - name: MIN_FREE_GIB
              value: "400"
            - name: WEIGHTS_BUCKET
              value: SUBSTITUTE-weights-bucket
            - name: WEIGHTS_PREFIX
              value: "nemotron-3-ultra-nvfp4"
            - name: AWS_REGION
              value: "us-east-1"
          volumeMounts:
            - { name: models, mountPath: /models }
          resources:
            requests: { cpu: "16", memory: 32Gi }
            limits: { cpu: "32", memory: 64Gi }
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.29.0
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              echo "=== provenance (captured into the result bundle) ==="
              nvidia-smi --query-gpu=index,name,memory.total --format=csv
              nvidia-smi topo -m || true
              if nvidia-smi topo -m 2>/dev/null | grep -qE '\bNV[0-9]+\b'; then
                echo "  NVLink mesh detected - good."
              else
                echo "  WARNING: no NVLink pairs in topo matrix. Do not trust results."
              fi

              echo "=== flag surface check ==="
              for f in --attention-backend --kv-cache-dtype --max-cudagraph-capture-size \
                       --stream-interval --scheduling-policy --async-scheduling \
                       --no-enable-prefix-caching --max-num-batched-tokens; do
                vllm serve --help=all 2>/dev/null | grep -q -- "$f" \
                  && echo "  OK     $f" || echo "  ABSENT $f  <-- fix the command below"
              done

              echo "=== starting vLLM on ${INSTANCE_TYPE}: $(date -u) - loading ~328 GiB ==="
              ARGS=(
                /models/nemotron-3-ultra-nvfp4
                --served-model-name nemotron-3-ultra
                --tensor-parallel-size 8
                --kv-cache-dtype "${KV_CACHE_DTYPE}"
                --attention-backend "${ATTENTION_BACKEND}"
                --gpu-memory-utilization "${GPU_MEM_UTIL}"
                --max-model-len "${MAX_MODEL_LEN}"
                --max-num-seqs "${MAX_NUM_SEQS}"
                --max-num-batched-tokens "${MAX_NUM_BATCHED_TOKENS}"
                --stream-interval "${STREAM_INTERVAL}"
                --scheduling-policy "${SCHEDULING_POLICY}"
                --max-cudagraph-capture-size "${MAX_CUDAGRAPH}"
                --async-scheduling
                --no-enable-prefix-caching
                --enable-chunked-prefill
                --port 8000
              )
              printf '  argv: %s\n' "${ARGS[@]}"
              exec vllm serve "${ARGS[@]}"
          ports:
            - containerPort: 8000
          env:
            # No --quantization flag: the checkpoint's quantization_config declares a ModelOpt
            # mixed NVFP4/FP8 export (4-bit group-16 weight groups plus FP8 groups, 243 modules
            # kept high-precision) and the loader resolves it. Pinning a single method here would
            # mis-read the mixed export the way the vanilla fp8 loader mis-read Gemma's ModelOpt
            # export; the deploy script prints the resolved method from the server log instead.
            - name: KV_CACHE_DTYPE
              value: "fp8"
            - name: MAX_MODEL_LEN
              value: "32768"
            - name: MAX_NUM_SEQS
              value: "256"
            - name: MAX_NUM_BATCHED_TOKENS
              value: "32768"
            - name: STREAM_INTERVAL
              value: "10"
            - name: SCHEDULING_POLICY
              value: "fcfs"
            - name: MAX_CUDAGRAPH
              value: "256"
            - name: GPU_MEM_UTIL
              value: "0.90"
            # Pinned rather than auto-selected, and passed to the server as --attention-backend,
            # not as VLLM_ATTENTION_BACKEND: v0.29.0 does not read that variable.
            - name: ATTENTION_BACKEND
              value: "FLASH_ATTN"
            - name: INSTANCE_TYPE
              value: "p6-b200.48xlarge"
            - name: BENCH_CONFIG
              value: "b200-fp8kv-32k-tp8-flashattn"
            - name: PYTHONUNBUFFERED
              value: "1"
            # INFO rather than WARNING so the chosen backend and resolved quantization method
            # are visible in the server log; the deploy script asserts on both.
            - name: VLLM_LOGGING_LEVEL
              value: "INFO"
          resources:
            limits:
              nvidia.com/gpu: "8"
              memory: 1600Gi
            requests:
              cpu: "96"
              memory: 512Gi
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 15
            failureThreshold: 240
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 30
            failureThreshold: 6
          volumeMounts:
            - { name: models, mountPath: /models }
            - { name: dshm, mountPath: /dev/shm }
      volumes:
        - name: models
          emptyDir: { sizeLimit: 800Gi }
        - name: dshm
          emptyDir: { medium: Memory, sizeLimit: 64Gi }
      terminationGracePeriodSeconds: 120
---
apiVersion: v1
kind: Service
metadata:
  name: nemotron-3-ultra-vllm-b200-fp8kv-32k-flashattn
spec:
  selector: { app: nemotron-3-ultra-vllm-b200-fp8kv-32k-flashattn }
  ports:
    - { protocol: TCP, port: 8000, targetPort: 8000 }
