#
# Gemma 4 E4B at FP8 on one g7.2xlarge, a single GPU, tuned for real-time latency. Pairs with fp8-g7.2xlarge-throughput.yaml; serves the ModelOpt checkpoint from fsx-pvc with a 16-bit KV cache, streams every token, and prefix caching is off.
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemma4-e4b-vllm-g7-2xl-fp8-latency
  labels: { app: gemma4-e4b-vllm-g7-2xl-fp8-latency }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: gemma4-e4b-vllm-g7-2xl-fp8-latency }
  template:
    metadata:
      labels: { app: gemma4-e4b-vllm-g7-2xl-fp8-latency }
    spec:
      nodeSelector:
        node.kubernetes.io/instance-type: "g7.2xlarge"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: vllm
          image: public.ecr.aws/deep-learning-containers/vllm:0.21.0-gpu-py312
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              echo "=== starting vLLM on ${INSTANCE_TYPE}: $(date -u) ==="
              vllm serve ${MODEL_DIR} \
                --quantization ${QUANTIZATION} \
                --dtype ${DTYPE} \
                --kv-cache-dtype ${KV_CACHE_DTYPE} \
                --gpu-memory-utilization ${GPU_MEM_UTIL} \
                --max-model-len ${MAX_MODEL_LEN} \
                --max-num-seqs ${MAX_NUM_SEQS} \
                --max-num-batched-tokens ${MAX_NUM_BATCHED_TOKENS} \
                --stream-interval ${STREAM_INTERVAL} \
                --scheduling-policy ${SCHEDULING_POLICY} \
                --async-scheduling \
                --no-enable-prefix-caching \
                --enable-chunked-prefill \
                --port 8000
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_DIR
              value: "/models/quantized/gemma-4-E4B-it-fp8"
            - name: QUANTIZATION
              value: "modelopt"
            - name: DTYPE
              value: "bfloat16"
            # Must stay "auto": "bfloat16" passes the CLI then aborts the engine. See the runbook.
            - name: KV_CACHE_DTYPE
              value: "auto"
            - name: MAX_MODEL_LEN
              value: "8192"
            - name: MAX_NUM_SEQS
              value: "1024"
            - name: MAX_NUM_BATCHED_TOKENS
              value: "2048"
            - name: STREAM_INTERVAL
              value: "1"
            - name: SCHEDULING_POLICY
              value: "fcfs"
            - name: GPU_MEM_UTIL
              value: "0.90"
            - name: INSTANCE_TYPE
              value: "g7.2xlarge"
            - name: HF_HOME
              value: "/models"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: VLLM_ATTENTION_BACKEND
              value: "FLASHINFER"
            - name: VLLM_LOGGING_LEVEL
              value: "WARNING"
          resources:
            limits:
              nvidia.com/gpu: 1
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 15
            failureThreshold: 120
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 30
            failureThreshold: 6
          volumeMounts:
            - { name: dshm, mountPath: /dev/shm }
            - { name: model-storage, mountPath: /models }
            - { name: sitecustomize, mountPath: /usr/local/lib/python3.12/dist-packages/sitecustomize.py, subPath: sitecustomize.py }
      volumes:
        - name: dshm
          emptyDir: { medium: Memory }
        - name: model-storage
          persistentVolumeClaim: { claimName: fsx-pvc }
        - name: sitecustomize
          configMap: { name: vllm-sitecustomize }
      terminationGracePeriodSeconds: 120
---
apiVersion: v1
kind: Service
metadata:
  name: gemma4-e4b-vllm-g7-2xl-fp8-latency
spec:
  selector: { app: gemma4-e4b-vllm-g7-2xl-fp8-latency }
  ports:
    - { protocol: TCP, port: 8000, targetPort: 8000 }
