#
# Gemma 4 E4B at FP8 with an FP8 KV cache on one g7e.2xlarge, attention backend pinned to FLASH_ATTN.
# FlashAttention. Which FA version the build selects on sm_120 is part of the measurement: FA4 on Blackwell wants KV block_size 128 at head_size 256, and sm_120 is not sm_10x.
# SUBSTITUTE: nothing. All arms of this A/B hold every flag but --attention-backend, and run at
# --gpu-memory-utilization 0.90 rather than the 0.80 the fp8kv pair uses, so compare arms against
# each other rather than against the fp8kv baseline.
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemma4-e4b-vllm-g7e-2xl-fp8kv-flashattn
  labels: { app: gemma4-e4b-vllm-g7e-2xl-fp8kv-flashattn }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: gemma4-e4b-vllm-g7e-2xl-fp8kv-flashattn }
  template:
    metadata:
      labels: { app: gemma4-e4b-vllm-g7e-2xl-fp8kv-flashattn }
    spec:
      nodeSelector:
        node.kubernetes.io/instance-type: "g7e.2xlarge"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.29.0
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              echo "=== starting vLLM on ${INSTANCE_TYPE}: $(date -u) ==="
              vllm serve ${MODEL_DIR} \
                --quantization ${QUANTIZATION} \
                --dtype ${DTYPE} \
                --kv-cache-dtype ${KV_CACHE_DTYPE} \
                --attention-backend ${ATTENTION_BACKEND} \
                --gpu-memory-utilization ${GPU_MEM_UTIL} \
                --max-model-len ${MAX_MODEL_LEN} \
                --max-num-seqs ${MAX_NUM_SEQS} \
                --max-num-batched-tokens ${MAX_NUM_BATCHED_TOKENS} \
                --stream-interval ${STREAM_INTERVAL} \
                --scheduling-policy ${SCHEDULING_POLICY} \
                --max-cudagraph-capture-size ${MAX_CUDAGRAPH} \
                --async-scheduling \
                --no-enable-prefix-caching \
                --enable-chunked-prefill \
                --port 8000
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_DIR
              value: "/models/quantized/gemma-4-E4B-it-fp8"
            - name: QUANTIZATION
              value: "modelopt"
            - name: DTYPE
              value: "bfloat16"
            # The one difference from the BF16-KV sibling. "bfloat16" is rejected by the engine
            # and "auto" resolves through DTYPE to BF16, which is what the sibling serves.
            # No --calculate-kv-scales here: v0.29.0 rejects it with "unrecognized arguments" and
            # the engine will not start. The Qwen kvscales recipes pass it on vLLM 0.21.0. This
            # server therefore runs uncalibrated and logs "Using KV cache scaling factor 1.0 for
            # fp8_e4m3" at startup, which is a caveat on any accuracy claim taken from it.
            - name: KV_CACHE_DTYPE
              value: "fp8"
            - name: MAX_MODEL_LEN
              value: "8192"
            - name: MAX_NUM_SEQS
              value: "1024"
            - name: MAX_NUM_BATCHED_TOKENS
              value: "16384"
            - name: STREAM_INTERVAL
              value: "10"
            - name: SCHEDULING_POLICY
              value: "fcfs"
            # Matches the canonical sweep's top level, so every measured batch size is
            # graph-captured and nothing is captured above it.
            - name: MAX_CUDAGRAPH
              value: "512"
            # Held at the g7.2xlarge value so precision and instance are the only variables; this card has 96 GiB.
            - name: GPU_MEM_UTIL
              value: "0.90"
            # Pinned rather than auto-selected: vLLM's auto priority tables are written for
            # sm_10x B200 and this card is sm_120, so the kernel path is an A/B rather than a
            # known default. Passed to the server as --attention-backend, not as
            # VLLM_ATTENTION_BACKEND: v0.29.0 does not read that variable, logs "Unknown vLLM
            # environment variable detected" for it, and carries no such name in vllm.envs, so
            # setting it leaves the engine on whatever it auto-selects. Values are the names in
            # vllm.v1.attention.backends.registry.AttentionBackendEnum.
            - name: ATTENTION_BACKEND
              value: "FLASH_ATTN"
            - name: INSTANCE_TYPE
              value: "g7e.2xlarge"
            - name: HF_HOME
              value: "/models"
            - name: PYTHONUNBUFFERED
              value: "1"
            # INFO rather than WARNING so the chosen backend is visible in the server log.
            # Which kernel served is the entire question these arms ask, and no result file
            # records it. Set identically in all three arms, so it is not a variable.
            - name: VLLM_LOGGING_LEVEL
              value: "INFO"
          resources:
            limits:
              nvidia.com/gpu: 1
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 15
            failureThreshold: 120
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 30
            failureThreshold: 6
          volumeMounts:
            - { name: dshm, mountPath: /dev/shm }
            - { name: model-storage, mountPath: /models }
      volumes:
        - name: dshm
          emptyDir: { medium: Memory }
        - name: model-storage
          persistentVolumeClaim: { claimName: fsx-pvc }
      terminationGracePeriodSeconds: 120
---
apiVersion: v1
kind: Service
metadata:
  name: gemma4-e4b-vllm-g7e-2xl-fp8kv-flashattn
spec:
  selector: { app: gemma4-e4b-vllm-g7e-2xl-fp8kv-flashattn }
  ports:
    - { protocol: TCP, port: 8000, targetPort: 8000 }
