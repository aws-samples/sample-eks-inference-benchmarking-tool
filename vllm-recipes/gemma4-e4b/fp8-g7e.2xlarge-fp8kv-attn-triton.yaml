# Gemma 4 E4B at FP8 with an FP8 KV cache on one g7e.2xlarge (1 GPU), Triton attention backend.
# SUBSTITUTE: fsx-pvc if your claim is named differently.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemma4-e4b-vllm-g7e-2xl-fp8kv-triton
  labels: { app: gemma4-e4b-vllm-g7e-2xl-fp8kv-triton }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: gemma4-e4b-vllm-g7e-2xl-fp8kv-triton }
  template:
    metadata:
      labels: { app: gemma4-e4b-vllm-g7e-2xl-fp8kv-triton }
    spec:
      nodeSelector:
        node.kubernetes.io/instance-type: "g7e.2xlarge"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.29.0
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              echo "=== starting vLLM on ${INSTANCE_TYPE}: $(date -u) ==="
              vllm serve ${MODEL_DIR} \
                --quantization ${QUANTIZATION} \
                --dtype ${DTYPE} \
                --kv-cache-dtype ${KV_CACHE_DTYPE} \
                --attention-backend ${ATTENTION_BACKEND} \
                --gpu-memory-utilization ${GPU_MEM_UTIL} \
                --max-model-len ${MAX_MODEL_LEN} \
                --max-num-seqs ${MAX_NUM_SEQS} \
                --max-num-batched-tokens ${MAX_NUM_BATCHED_TOKENS} \
                --stream-interval ${STREAM_INTERVAL} \
                --scheduling-policy ${SCHEDULING_POLICY} \
                --max-cudagraph-capture-size ${MAX_CUDAGRAPH} \
                --async-scheduling \
                --no-enable-prefix-caching \
                --enable-chunked-prefill \
                --port 8000
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_DIR
              value: "/models/quantized/gemma-4-E4B-it-fp8"
            - name: QUANTIZATION
              value: "modelopt"
            - name: DTYPE
              value: "bfloat16"
            # KV scales are uncalibrated (factor 1.0): vLLM 0.29.0 does not accept --calculate-kv-scales.
            - name: KV_CACHE_DTYPE
              value: "fp8"
            - name: MAX_MODEL_LEN
              value: "8192"
            - name: MAX_NUM_SEQS
              value: "1024"
            - name: MAX_NUM_BATCHED_TOKENS
              value: "16384"
            - name: STREAM_INTERVAL
              value: "10"
            - name: SCHEDULING_POLICY
              value: "fcfs"
            # Largest batch size captured as a CUDA graph.
            - name: MAX_CUDAGRAPH
              value: "512"
            - name: GPU_MEM_UTIL
              value: "0.90"
            # Passed as --attention-backend because vLLM 0.29.0 ignores VLLM_ATTENTION_BACKEND.
            # Values are AttentionBackendEnum names in vllm.v1.attention.backends.registry.
            - name: ATTENTION_BACKEND
              value: "TRITON_ATTN"
            - name: INSTANCE_TYPE
              value: "g7e.2xlarge"
            - name: HF_HOME
              value: "/models"
            - name: PYTHONUNBUFFERED
              value: "1"
            # INFO logs the selected attention backend at startup.
            - name: VLLM_LOGGING_LEVEL
              value: "INFO"
          resources:
            limits:
              nvidia.com/gpu: 1
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 15
            failureThreshold: 120
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 30
            failureThreshold: 6
          volumeMounts:
            - { name: dshm, mountPath: /dev/shm }
            - { name: model-storage, mountPath: /models }
      volumes:
        - name: dshm
          emptyDir: { medium: Memory }
        - name: model-storage
          persistentVolumeClaim: { claimName: fsx-pvc }
      terminationGracePeriodSeconds: 120
---
apiVersion: v1
kind: Service
metadata:
  name: gemma4-e4b-vllm-g7e-2xl-fp8kv-triton
spec:
  selector: { app: gemma4-e4b-vllm-g7e-2xl-fp8kv-triton }
  ports:
    - { protocol: TCP, port: 8000, targetPort: 8000 }
