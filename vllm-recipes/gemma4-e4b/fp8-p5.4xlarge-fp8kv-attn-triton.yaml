# Gemma 4 E4B at FP8 with an FP8 KV cache on one p5.4xlarge (1x H100), Triton attention backend.
# Weights are staged from S3 onto the node's local NVMe instance store.
# SUBSTITUTE: WEIGHTS_BUCKET and AWS_REGION in the init container, and serviceAccountName for any
# service account with S3 read on the bucket (EKS Pod Identity).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemma4-e4b-vllm-p5-4xl-fp8kv-triton
  labels: { app: gemma4-e4b-vllm-p5-4xl-fp8kv-triton }
spec:
  # The S3 weight sync can outlast the 600 s default progress deadline.
  progressDeadlineSeconds: 3600
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: gemma4-e4b-vllm-p5-4xl-fp8kv-triton }
  template:
    metadata:
      labels: { app: gemma4-e4b-vllm-p5-4xl-fp8kv-triton }
    spec:
      serviceAccountName: gemma4-e4b-bench
      nodeSelector:
        node.kubernetes.io/instance-type: "p5.4xlarge"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: fetch-weights
          image: public.ecr.aws/aws-cli/aws-cli:latest
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              D=/models/quantized/gemma-4-E4B-it-fp8
              echo "weights sync start $(date -u)"; df -h /models | tail -1
              aws s3 sync "s3://${WEIGHTS_BUCKET}/${WEIGHTS_PREFIX}/" "$D/" --region "${AWS_REGION}" --only-show-errors
              SHARDS=$(find "$D" -name '*.safetensors' | wc -l)
              SZ=$(du -s --block-size=1G "$D" | cut -f1)
              echo "weights staged ${SZ} GiB, ${SHARDS} shards  $(date -u)"
              test -f "$D/hf_quant_config.json" || { echo "FATAL: no hf_quant_config.json; not the ModelOpt FP8 export" >&2; exit 1; }
              test "$SHARDS" -eq 1 || { echo "FATAL: expected 1 shard, got ${SHARDS}" >&2; exit 1; }
              test "$SZ" -ge 10 || { echo "FATAL: expected ~11 GiB, got ${SZ} GiB" >&2; exit 1; }
          env:
            - name: WEIGHTS_BUCKET
              value: gemma4-e4b-model-weights-012345678901-us-east-1
            - name: WEIGHTS_PREFIX
              value: "gemma4-e4b-fp8-quantized"
            - name: AWS_REGION
              value: "us-east-1"
          volumeMounts:
            - { name: model-storage, mountPath: /models }
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.29.0
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              echo "=== starting vLLM on ${INSTANCE_TYPE}: $(date -u) ==="
              vllm serve ${MODEL_DIR} \
                --quantization ${QUANTIZATION} \
                --dtype ${DTYPE} \
                --kv-cache-dtype ${KV_CACHE_DTYPE} \
                --attention-backend ${ATTENTION_BACKEND} \
                --gpu-memory-utilization ${GPU_MEM_UTIL} \
                --max-model-len ${MAX_MODEL_LEN} \
                --max-num-seqs ${MAX_NUM_SEQS} \
                --max-num-batched-tokens ${MAX_NUM_BATCHED_TOKENS} \
                --stream-interval ${STREAM_INTERVAL} \
                --scheduling-policy ${SCHEDULING_POLICY} \
                --max-cudagraph-capture-size ${MAX_CUDAGRAPH} \
                --async-scheduling \
                --no-enable-prefix-caching \
                --enable-chunked-prefill \
                --port 8000
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_DIR
              value: "/models/quantized/gemma-4-E4B-it-fp8"
            - name: QUANTIZATION
              value: "modelopt"
            - name: DTYPE
              value: "bfloat16"
            # KV scales are uncalibrated (factor 1.0): vLLM 0.29.0 does not accept --calculate-kv-scales.
            - name: KV_CACHE_DTYPE
              value: "fp8"
            - name: MAX_MODEL_LEN
              value: "8192"
            - name: MAX_NUM_SEQS
              value: "1024"
            - name: MAX_NUM_BATCHED_TOKENS
              value: "16384"
            - name: STREAM_INTERVAL
              value: "10"
            - name: SCHEDULING_POLICY
              value: "fcfs"
            # Largest batch size captured as a CUDA graph.
            - name: MAX_CUDAGRAPH
              value: "512"
            - name: GPU_MEM_UTIL
              value: "0.90"
            # Passed as --attention-backend because vLLM 0.29.0 ignores VLLM_ATTENTION_BACKEND.
            # Values are AttentionBackendEnum names in vllm.v1.attention.backends.registry.
            - name: ATTENTION_BACKEND
              value: "TRITON_ATTN"
            - name: INSTANCE_TYPE
              value: "p5.4xlarge"
            - name: HF_HOME
              value: "/models"
            - name: PYTHONUNBUFFERED
              value: "1"
            # INFO logs the selected attention backend at startup.
            - name: VLLM_LOGGING_LEVEL
              value: "INFO"
          resources:
            limits:
              nvidia.com/gpu: 1
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 15
            failureThreshold: 120
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 30
            failureThreshold: 6
          volumeMounts:
            - { name: dshm, mountPath: /dev/shm }
            - { name: model-storage, mountPath: /models }
      volumes:
        - name: dshm
          emptyDir: { medium: Memory }
        # Must land on the NVMe instance store: set instanceStorePolicy RAID0 on the node class.
        - name: model-storage
          emptyDir: { sizeLimit: 40Gi }
      terminationGracePeriodSeconds: 120
---
apiVersion: v1
kind: Service
metadata:
  name: gemma4-e4b-vllm-p5-4xl-fp8kv-triton
spec:
  selector: { app: gemma4-e4b-vllm-p5-4xl-fp8kv-triton }
  ports:
    - { protocol: TCP, port: 8000, targetPort: 8000 }
