# Gemma 4 E4B at FP8 with an FP8 KV cache on one p5.4xlarge (1x H100), Triton attention backend. An init
# container quantizes the model to FP8 onto the node's NVMe emptyDir at /models on first start, and vLLM
# serves from it; no FSx claim or S3 is involved, and a pod restart simply re-quantizes.
# SUBSTITUTE: 012345678901 and us-east-1 in the quantizer image reference (the deploy script fills these).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemma4-e4b-vllm-p5-4xl-fp8kv-triton
  labels: { app: gemma4-e4b-vllm-p5-4xl-fp8kv-triton }
spec:
  # The init-container quantize can outlast the 600 s default progress deadline.
  progressDeadlineSeconds: 3600
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: gemma4-e4b-vllm-p5-4xl-fp8kv-triton }
  template:
    metadata:
      labels: { app: gemma4-e4b-vllm-p5-4xl-fp8kv-triton }
    spec:
      nodeSelector:
        node.kubernetes.io/instance-type: "p5.4xlarge"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      initContainers:
        # Quantizes Gemma 4 E4B to ModelOpt FP8 onto the shared /models emptyDir, then hands the GPU to
        # vLLM. The vision and audio towers, projector and head stay 16-bit (QUANT_EXCLUDE_PATTERNS).
        - name: quantize
          image: 012345678901.dkr.ecr.us-east-1.amazonaws.com/serving-sweep-quantizer:latest
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              nvidia-smi --query-gpu=name,memory.total --format=csv,noheader
              cd /app/src && exec python quantize.py
          env:
            - name: MODEL_ID
              value: "google/gemma-4-E4B-it"
            - name: QUANTIZATION_FORMAT
              value: "fp8"
            # The default causal_lm auto-class cannot load this checkpoint.
            - name: MODEL_LOADER
              value: "image_text_to_text"
            - name: QUANT_EXCLUDE_PATTERNS
              value: "*vision_tower*,*embed_vision*,*multi_modal_projector*,*vision*,*audio_tower*,*embed_audio*,*audio*,*lm_head*"
            - name: MODEL_CACHE_DIR
              value: "/models/cache"
            - name: OUTPUT_DIR
              value: "/models/quantized"
            - name: MODELOPT_REAL_EXPORT
              value: "1"
            - name: CALIBRATE
              value: "1"
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef: { name: hf-token, key: token }
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            limits:
              nvidia.com/gpu: 1
            requests:
              cpu: "4"
              memory: 20Gi
          volumeMounts:
            - { name: model-storage, mountPath: /models }
            - { name: dshm, mountPath: /dev/shm }
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.29.0
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              echo "=== starting vLLM on ${INSTANCE_TYPE}: $(date -u) ==="
              vllm serve ${MODEL_DIR} \
                --quantization ${QUANTIZATION} \
                --dtype ${DTYPE} \
                --kv-cache-dtype ${KV_CACHE_DTYPE} \
                --attention-backend ${ATTENTION_BACKEND} \
                --gpu-memory-utilization ${GPU_MEM_UTIL} \
                --max-model-len ${MAX_MODEL_LEN} \
                --max-num-seqs ${MAX_NUM_SEQS} \
                --max-num-batched-tokens ${MAX_NUM_BATCHED_TOKENS} \
                --stream-interval ${STREAM_INTERVAL} \
                --scheduling-policy ${SCHEDULING_POLICY} \
                --max-cudagraph-capture-size ${MAX_CUDAGRAPH} \
                --async-scheduling \
                --no-enable-prefix-caching \
                --enable-chunked-prefill \
                --port 8000
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_DIR
              value: "/models/quantized/gemma-4-E4B-it-fp8"
            - name: QUANTIZATION
              value: "modelopt"
            - name: DTYPE
              value: "bfloat16"
            # KV scales are uncalibrated (factor 1.0): vLLM 0.29.0 does not accept --calculate-kv-scales.
            - name: KV_CACHE_DTYPE
              value: "fp8"
            - name: MAX_MODEL_LEN
              value: "8192"
            - name: MAX_NUM_SEQS
              value: "1024"
            - name: MAX_NUM_BATCHED_TOKENS
              value: "16384"
            - name: STREAM_INTERVAL
              value: "10"
            - name: SCHEDULING_POLICY
              value: "fcfs"
            # Largest batch size captured as a CUDA graph.
            - name: MAX_CUDAGRAPH
              value: "512"
            - name: GPU_MEM_UTIL
              value: "0.90"
            # Passed as --attention-backend because vLLM 0.29.0 ignores VLLM_ATTENTION_BACKEND.
            # Values are AttentionBackendEnum names in vllm.v1.attention.backends.registry.
            - name: ATTENTION_BACKEND
              value: "TRITON_ATTN"
            - name: INSTANCE_TYPE
              value: "p5.4xlarge"
            - name: HF_HOME
              value: "/models"
            - name: PYTHONUNBUFFERED
              value: "1"
            # INFO logs the selected attention backend at startup.
            - name: VLLM_LOGGING_LEVEL
              value: "INFO"
          resources:
            limits:
              nvidia.com/gpu: 1
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 15
            failureThreshold: 120
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 30
            failureThreshold: 6
          volumeMounts:
            - { name: dshm, mountPath: /dev/shm }
            - { name: model-storage, mountPath: /models }
      volumes:
        - name: dshm
          emptyDir: { medium: Memory }
        # Node-local NVMe (the RAID0 instance store provision-capacity-block.sh sets up); holds the base
        # download plus the quantized checkpoint, and is discarded with the pod.
        - name: model-storage
          emptyDir: { sizeLimit: 100Gi }
      terminationGracePeriodSeconds: 120
---
apiVersion: v1
kind: Service
metadata:
  name: gemma4-e4b-vllm-p5-4xl-fp8kv-triton
spec:
  selector: { app: gemma4-e4b-vllm-p5-4xl-fp8kv-triton }
  ports:
    - { protocol: TCP, port: 8000, targetPort: 8000 }
