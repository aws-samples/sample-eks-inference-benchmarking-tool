#
# Kimi K3 at MXFP4 across two p6-b200.48xlarge nodes as a StatefulSet, 16 GPUs, tuned for latency rather than throughput. Use this when the question is time to first token rather than tokens per second.
#
# SUBSTITUTE: 012345678901 and us-east-1 in the image reference, and WEIGHTS_BUCKET.
---
apiVersion: v1
kind: Service
metadata:
  name: kimi-k3-b200-lat
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app: kimi-k3-b200-lat }
  ports:
    - { name: rendezvous, protocol: TCP, port: 29500, targetPort: 29500 }
    - { name: http, protocol: TCP, port: 8000, targetPort: 8000 }
---
apiVersion: v1
kind: Service
metadata:
  name: kimi-k3-b200-lat-api
spec:
  selector:
    app: kimi-k3-b200-lat
    statefulset.kubernetes.io/pod-name: kimi-k3-b200-lat-0
  ports:
    - { protocol: TCP, port: 8000, targetPort: 8000 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kimi-k3-b200-lat
spec:
  serviceName: kimi-k3-b200-lat
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels: { app: kimi-k3-b200-lat }
  template:
    metadata:
      labels: { app: kimi-k3-b200-lat }
    spec:
      serviceAccountName: kimi-k3-bench
      nodeSelector:
        node.kubernetes.io/instance-type: p6-b200.48xlarge
      tolerations:
        - operator: Exists
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: { app: kimi-k3-b200-lat }
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: fetch-weights
          image: public.ecr.aws/aws-cli/aws-cli:latest
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              aws configure set default.s3.max_concurrent_requests 64
              aws configure set default.s3.multipart_chunksize 64MB
              aws configure set default.s3.max_queue_size 10000
              echo "sync main weights $(date -u)"
              # An emptyDir lands wherever kubelet's root is, which is not always the instance store.
              # Check the space is really here before pulling a checkpoint this size onto a root disk.
              avail=$(df -Pk /models | awk 'NR==2 {print int($4/1048576)}')
              if [ "$avail" -lt "$MIN_FREE_GIB" ]; then
                echo "FATAL: ${avail} GiB free at /models, need ${MIN_FREE_GIB} GiB." >&2
                echo "  If that is a root disk rather than the NVMe array, this node's ephemeral" >&2
                echo "  storage is not on the instance store and the sync would fill it." >&2
                exit 1
              fi

              aws s3 sync "s3://${WEIGHTS_BUCKET}/${WEIGHTS_PREFIX}/" /models/kimi-k3-mxfp4/ \
                --region us-west-2 --only-show-errors
              SZ=$(du -s --block-size=1G /models/kimi-k3-mxfp4 | cut -f1)
              echo "weights staged ${SZ} GiB"
              test "$SZ" -ge 1400 || (echo "FATAL: expected ~1454 GiB, got ${SZ} GiB" >&2; exit 1)

              echo "sync DSpark draft $(date -u)"
              aws s3 sync "s3://${WEIGHTS_BUCKET}/${DRAFT_PREFIX}/" /models/kimi-k3-dspark/ \
                --region us-west-2 --only-show-errors
              test -n "$(ls -A /models/kimi-k3-dspark 2>/dev/null)" \
                || (echo "FATAL: DSpark draft missing - run kimi-k3-dspark-hf-to-s3.yaml first" >&2; exit 1)
              du -sh /models/kimi-k3-dspark
              echo "sync done $(date -u)"
          env:
            - name: MIN_FREE_GIB
              value: "1500"
            - name: WEIGHTS_BUCKET
              value: "kimi-k3-mxfp4-weights"
            - name: WEIGHTS_PREFIX
              value: "kimi-k3-mxfp4"
            - name: DRAFT_PREFIX
              value: "kimi-k3-dspark"
          volumeMounts:
            - { name: models, mountPath: /models }
          resources:
            requests: { cpu: "16", memory: 32Gi }
            limits: { cpu: "32", memory: 64Gi }
      containers:
        - name: vllm
          image: 012345678901.dkr.ecr.us-east-1.amazonaws.com/vllm-kimi-k3-efa:nccl2.29.7-efa1.49.0
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              RANK="${HOSTNAME##*-}"
              EXTRA=""
              LEADER="kimi-k3-b200-lat-0.kimi-k3-b200-lat.${POD_NAMESPACE}.svc.cluster.local"
              echo "host=${HOSTNAME} rank=${RANK} leader=${LEADER}"

              echo "=== EFA / NCCL plugin verification ==="
              verify-efa-nccl || true

              if [ "${RANK}" != "0" ]; then
                echo "waiting for leader DNS..."
                until getent hosts "${LEADER}" >/dev/null 2>&1; do sleep 5; done
                EXTRA="--headless"
              fi

              echo "=== starting vLLM LATENCY config (rank ${RANK}): $(date -u) ==="
              vllm serve /models/kimi-k3-mxfp4 ${EXTRA} \
                --served-model-name kimi-k3 \
                --tensor-parallel-size ${TP_SIZE} \
                --pipeline-parallel-size ${PP_SIZE} \
                --nnodes 2 \
                --node-rank "${RANK}" \
                --master-addr "${LEADER}" \
                --master-port 29500 \
                --trust-remote-code \
                --load-format fastsafetensors \
                --moe-backend flashinfer_trtllm \
                --max-model-len ${MAX_MODEL_LEN} \
                --max-num-seqs ${MAX_NUM_SEQS} \
                --gpu-memory-utilization 0.9 \
                --max-cudagraph-capture-size 256 \
                --kv-cache-dtype fp8 \
                --attention-config '{"mla_prefill_backend":"FLASHINFER","use_prefill_query_quantization":true}' \
                --enable-prefix-caching \
                --enable-auto-tool-choice \
                --tool-call-parser kimi_k3 \
                --reasoning-parser kimi_k3 \
                --port 8000
          ports:
            - { name: http, containerPort: 8000 }
            - { name: rendezvous, containerPort: 29500 }
          env:
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: TP_SIZE
              value: "8"
            - name: PP_SIZE
              value: "2"
            - name: MAX_MODEL_LEN
              value: "32768"
            - name: MAX_NUM_SEQS
              value: "32"
            - name: NUM_SPEC_TOKENS
              value: "7"
            - name: VLLM_USE_V2_MODEL_RUNNER
              value: "1"
            - name: VLLM_PREFIX_CACHE_RETENTION_INTERVAL
              value: "0"
            - name: VLLM_ENGINE_READY_TIMEOUT_S
              value: "3600"
            - name: NCCL_DMABUF_ENABLE
              value: "0"
            - name: VLLM_ALLREDUCE_USE_FLASHINFER
              value: "1"
            - name: VLLM_USE_RUST_FRONTEND
              value: "1"
            - name: FI_PROVIDER
              value: "efa"
            - name: FI_EFA_USE_DEVICE_RDMA
              value: "1"
            - name: UCX_TLS
              value: "rc,cuda_copy"
            - name: NCCL_DEBUG
              value: "INFO"
            - name: INSTANCE_TYPE
              value: "p6-b200.48xlarge-2nodes"
            - name: QUANTIZATION
              value: "mxfp4"
            - name: BENCH_CONFIG
              value: "latency-prefixcache-seqs32-v2runner-noDSpark"
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            limits:
              nvidia.com/gpu: "8"
              vpc.amazonaws.com/efa: "8"
              memory: 1500Gi
            requests:
              cpu: "96"
              memory: 1024Gi
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 15
            failureThreshold: 280
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - { name: models, mountPath: /models }
            - { name: dshm, mountPath: /dev/shm }
      volumes:
        - name: models
          emptyDir: { sizeLimit: 2000Gi }
        - name: dshm
          emptyDir: { medium: Memory, sizeLimit: 64Gi }
      terminationGracePeriodSeconds: 120
