#
# Kimi K3 at MXFP4 on one u-p6e-gb200x72, 16 GPUs in a single pod, tensor parallel 16. Use this when the whole model should sit inside one NVLink domain with no cross-node fabric.
#
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kimi-k3-bench-notes
data:
  methodology.md: |
    PREFIX CACHING IS OFF BY DEFAULT FOR K3 (unusual for vLLM - the hybrid KDA/full-attention
    cache design is still evolving). We do NOT pass --enable-prefix-caching, so throughput
    numbers are honest by default. If you enable it, label the result a cache-hit
    experiment, never a baseline. Our harness also emits unique prompts by default
    (app/bench/src/workload.py), matching the official recipe's randomized dataset.

    Model load reads ~1560 GB off FSx even with fastsafetensors. The first sweep after
    server start is a cold-start outlier and must be discarded.

    Reference numbers to sanity-check against (vLLM on GB300 NVL72, batch size 1):
      111 tok/s/user TP8, 118 tok/s/user TP16
      331 / 370 tok/s/user with DSpark speculative decoding (~3.1x)
    If we land wildly off these, suspect config before hardware.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kimi-k3-gb200
  labels: { app: kimi-k3 }
spec:
  replicas: 1
  selector:
    matchLabels: { app: kimi-k3 }
  template:
    metadata:
      labels: { app: kimi-k3 }
    spec:
      nodeSelector:
        node.kubernetes.io/instance-type: u-p6e-gb200x72
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: vllm
          image: vllm/vllm-openai:kimi-k3
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              echo "=== GPU / NVLink topology (capture into the result record) ==="
              nvidia-smi --query-gpu=index,name,memory.total --format=csv
              nvidia-smi topo -m || true

              echo "=== starting vLLM: $(date -u) - loading ~1560 GB ==="
              vllm serve moonshotai/Kimi-K3 \
                --served-model-name kimi-k3 \
                --tensor-parallel-size ${TP_SIZE} \
                --trust-remote-code \
                --load-format fastsafetensors \
                --moe-backend flashinfer_trtllm \
                --all2all-backend flashinfer_nvlink_one_sided \
                --max-model-len ${MAX_MODEL_LEN} \
                --max-num-seqs ${MAX_NUM_SEQS} \
                --gpu-memory-utilization 0.9 \
                --max-cudagraph-capture-size 256 \
                --kv-cache-dtype fp8 \
                --attention-config '{"mla_prefill_backend":"FLASHINFER","use_prefill_query_quantization":true}' \
                --enable-auto-tool-choice \
                --tool-call-parser kimi_k3 \
                --reasoning-parser kimi_k3 \
                --port 8000
          ports:
            - containerPort: 8000
          env:
            - name: TP_SIZE
              value: "16"
            - name: MAX_MODEL_LEN
              value: "auto"
            - name: MAX_NUM_SEQS
              value: "512"
            - name: VLLM_ENGINE_READY_TIMEOUT_S
              value: "3600"
            - name: NCCL_DMABUF_ENABLE
              value: "0"
            - name: VLLM_ALLREDUCE_USE_FLASHINFER
              value: "1"
            - name: VLLM_USE_RUST_FRONTEND
              value: "1"
            - name: INSTANCE_TYPE
              value: "u-p6e-gb200x72"
            - name: QUANTIZATION
              value: "mxfp4"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: HF_HOME
              value: "/models/.hfcache"
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef: { name: hf-token, key: token }
          resources:
            limits:
              nvidia.com/gpu: "16"
            requests:
              cpu: "64"
              memory: 512Gi
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 15
            failureThreshold: 240
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 30
            failureThreshold: 6
          volumeMounts:
            - { name: models, mountPath: /models }
            - { name: dshm, mountPath: /dev/shm }
            - { name: notes, mountPath: /notes }
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: fsx-pvc }
        - name: dshm
          emptyDir: { medium: Memory, sizeLimit: 128Gi }
        - name: notes
          configMap: { name: kimi-k3-bench-notes }
      terminationGracePeriodSeconds: 120
---
apiVersion: v1
kind: Service
metadata:
  name: kimi-k3-gb200
spec:
  selector: { app: kimi-k3 }
  ports:
    - { protocol: TCP, port: 8000, targetPort: 8000 }
