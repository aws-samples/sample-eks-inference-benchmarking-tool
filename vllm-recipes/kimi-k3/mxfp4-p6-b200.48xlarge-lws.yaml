#
# Kimi K3 at MXFP4 across two p6-b200.48xlarge nodes as a LeaderWorkerSet, 16 GPUs, tensor parallel 16. Use this as the runnable two-node baseline; the checkpoint does not fit one B200 node.
#
# SUBSTITUTE: 012345678901 and us-east-1 in the image reference, and WEIGHTS_BUCKET.
---
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: kimi-k3-b200-lws
spec:
  replicas: 1
  startupPolicy: LeaderCreated
  leaderWorkerTemplate:
    size: 2
    restartPolicy: RecreateGroupOnPodRestart
    leaderTemplate:
      metadata:
        labels: { app: kimi-k3-b200, role: leader }
      spec:
        serviceAccountName: kimi-k3-bench
        nodeSelector:
          node.kubernetes.io/instance-type: p6-b200.48xlarge
        tolerations:
          - operator: Exists
        initContainers:
          - name: fetch-weights
            image: public.ecr.aws/aws-cli/aws-cli:latest
            command: ["bash", "-c"]
            args:
              - |
                set -euo pipefail
                aws configure set default.s3.max_concurrent_requests 64
                aws configure set default.s3.multipart_chunksize 64MB
                aws configure set default.s3.max_queue_size 10000
                echo "syncing weights $(date -u)"
                df -h /models | tail -1
                # An emptyDir lands wherever kubelet's root is, which is not always the instance store.
                # Check the space is really here before pulling a checkpoint this size onto a root disk.
                avail=$(df -Pk /models | awk 'NR==2 {print int($4/1048576)}')
                if [ "$avail" -lt "$MIN_FREE_GIB" ]; then
                  echo "FATAL: ${avail} GiB free at /models, need ${MIN_FREE_GIB} GiB." >&2
                  echo "  If that is a root disk rather than the NVMe array, this node's ephemeral" >&2
                  echo "  storage is not on the instance store and the sync would fill it." >&2
                  exit 1
                fi

                aws s3 sync "s3://${WEIGHTS_BUCKET}/${WEIGHTS_PREFIX}/" /models/kimi-k3-mxfp4/ \
                  --region us-west-2 --only-show-errors
                echo "sync complete $(date -u)"
                du -sh /models/kimi-k3-mxfp4
                SZ=$(du -s --block-size=1G /models/kimi-k3-mxfp4 | cut -f1)
                echo "staged ${SZ} GiB"
                test "$SZ" -ge 1400 || (echo "FATAL: expected ~1454 GiB, got ${SZ}" >&2; exit 1)
            env:
              - name: MIN_FREE_GIB
                value: "1500"
              - name: WEIGHTS_BUCKET
                value: "kimi-k3-mxfp4-weights"
              - name: WEIGHTS_PREFIX
                value: "kimi-k3-mxfp4"
            volumeMounts:
              - { name: models, mountPath: /models }
            resources:
              requests: { cpu: "16", memory: 32Gi }
              limits: { cpu: "32", memory: 64Gi }
        containers:
          - name: vllm-leader
            image: 012345678901.dkr.ecr.us-east-1.amazonaws.com/vllm-kimi-k3-efa:nccl2.29.7-efa1.49.0
            command:
              - bash
              - -c
              - |
                set -euo pipefail
                echo "=== EFA / NCCL plugin verification (must pass before trusting results) ==="
                verify-efa-nccl || true
                nvidia-smi topo -m || true

                echo "=== starting vLLM leader: $(date -u) ==="
                vllm serve /models/kimi-k3-mxfp4 \
                  --served-model-name kimi-k3 \
                  --tensor-parallel-size ${TP_SIZE} \
                  --nnodes 2 \
                  --node-rank 0 \
                  --dist-init-addr ${LWS_LEADER_ADDRESS}:29500 \
                  --trust-remote-code \
                  --load-format fastsafetensors \
                  --moe-backend deep_gemm_mega_moe \
                  --all2all-backend deepep_v2 \
                  --max-model-len ${MAX_MODEL_LEN} \
                  --max-num-seqs ${MAX_NUM_SEQS} \
                  --gpu-memory-utilization 0.9 \
                  --max-cudagraph-capture-size 256 \
                  --kv-cache-dtype fp8 \
                  --attention-config '{"mla_prefill_backend":"FLASHINFER","use_prefill_query_quantization":true}' \
                  --enable-auto-tool-choice \
                  --tool-call-parser kimi_k3 \
                  --reasoning-parser kimi_k3 \
                  --port 8000
            ports:
              - containerPort: 8000
            env:
              - name: TP_SIZE
                value: "16"
              - name: MAX_MODEL_LEN
                value: "32768"
              - name: MAX_NUM_SEQS
                value: "512"
              - name: VLLM_ENGINE_READY_TIMEOUT_S
                value: "3600"
              - name: NCCL_DMABUF_ENABLE
                value: "0"
              - name: VLLM_ALLREDUCE_USE_FLASHINFER
                value: "1"
              - name: VLLM_USE_RUST_FRONTEND
                value: "1"
              - name: FI_PROVIDER
                value: "efa"
              - name: FI_EFA_USE_DEVICE_RDMA
                value: "1"
              - name: UCX_TLS
                value: "rc,cuda_copy"
              - name: NCCL_DEBUG
                value: "INFO"
              - name: INSTANCE_TYPE
                value: "p6-b200.48xlarge-2nodes"
              - name: QUANTIZATION
                value: "mxfp4"
              - name: BENCH_CONFIG
                value: "baseline-tp16-2node-efa"
              - name: PYTHONUNBUFFERED
                value: "1"
            resources:
              limits:
                nvidia.com/gpu: "8"
                vpc.amazonaws.com/efa: "8"
              requests:
                cpu: "96"
                memory: 1024Gi
            securityContext:
              capabilities:
                add: ["IPC_LOCK"]
            startupProbe:
              httpGet: { path: /health, port: 8000 }
              periodSeconds: 15
              failureThreshold: 240
            readinessProbe:
              httpGet: { path: /health, port: 8000 }
              periodSeconds: 10
              failureThreshold: 3
            volumeMounts:
              - { name: models, mountPath: /models }
              - { name: dshm, mountPath: /dev/shm }
        volumes:
          - name: models
            emptyDir: { sizeLimit: 2000Gi }
          - name: dshm
            emptyDir: { medium: Memory, sizeLimit: 128Gi }
        terminationGracePeriodSeconds: 120
    workerTemplate:
      metadata:
        labels: { app: kimi-k3-b200, role: worker }
      spec:
        serviceAccountName: kimi-k3-bench
        nodeSelector:
          node.kubernetes.io/instance-type: p6-b200.48xlarge
        tolerations:
          - operator: Exists
        initContainers:
          - name: fetch-weights
            image: public.ecr.aws/aws-cli/aws-cli:latest
            command: ["bash", "-c"]
            args:
              - |
                set -euo pipefail
                aws configure set default.s3.max_concurrent_requests 64
                aws configure set default.s3.multipart_chunksize 64MB
                aws configure set default.s3.max_queue_size 10000
                echo "syncing weights $(date -u)"
                # An emptyDir lands wherever kubelet's root is, which is not always the instance store.
                # Check the space is really here before pulling a checkpoint this size onto a root disk.
                avail=$(df -Pk /models | awk 'NR==2 {print int($4/1048576)}')
                if [ "$avail" -lt "$MIN_FREE_GIB" ]; then
                  echo "FATAL: ${avail} GiB free at /models, need ${MIN_FREE_GIB} GiB." >&2
                  echo "  If that is a root disk rather than the NVMe array, this node's ephemeral" >&2
                  echo "  storage is not on the instance store and the sync would fill it." >&2
                  exit 1
                fi

                aws s3 sync "s3://${WEIGHTS_BUCKET}/${WEIGHTS_PREFIX}/" /models/kimi-k3-mxfp4/ \
                  --region us-west-2 --only-show-errors
                echo "sync complete $(date -u)"
                SZ=$(du -s --block-size=1G /models/kimi-k3-mxfp4 | cut -f1)
                echo "staged ${SZ} GiB"
                test "$SZ" -ge 1400 || (echo "FATAL: expected ~1454 GiB, got ${SZ}" >&2; exit 1)
            env:
              - name: MIN_FREE_GIB
                value: "1500"
              - name: WEIGHTS_BUCKET
                value: "kimi-k3-mxfp4-weights"
              - name: WEIGHTS_PREFIX
                value: "kimi-k3-mxfp4"
            volumeMounts:
              - { name: models, mountPath: /models }
            resources:
              requests: { cpu: "16", memory: 32Gi }
              limits: { cpu: "32", memory: 64Gi }
        containers:
          - name: vllm-worker
            image: 012345678901.dkr.ecr.us-east-1.amazonaws.com/vllm-kimi-k3-efa:nccl2.29.7-efa1.49.0
            command:
              - bash
              - -c
              - |
                set -euo pipefail
                echo "worker rank=${LWS_WORKER_INDEX} leader=${LWS_LEADER_ADDRESS}"
                verify-efa-nccl || true
                vllm serve /models/kimi-k3-mxfp4 \
                  --served-model-name kimi-k3 \
                  --tensor-parallel-size ${TP_SIZE} \
                  --nnodes 2 \
                  --node-rank ${LWS_WORKER_INDEX} \
                  --dist-init-addr ${LWS_LEADER_ADDRESS}:29500 \
                  --trust-remote-code \
                  --load-format fastsafetensors \
                  --moe-backend deep_gemm_mega_moe \
                  --all2all-backend deepep_v2 \
                  --max-model-len ${MAX_MODEL_LEN} \
                  --max-num-seqs ${MAX_NUM_SEQS} \
                  --gpu-memory-utilization 0.9 \
                  --kv-cache-dtype fp8 \
                  --attention-config '{"mla_prefill_backend":"FLASHINFER","use_prefill_query_quantization":true}' \
                  --port 8000
            env:
              - name: TP_SIZE
                value: "16"
              - name: MAX_MODEL_LEN
                value: "32768"
              - name: MAX_NUM_SEQS
                value: "512"
              - name: VLLM_ENGINE_READY_TIMEOUT_S
                value: "3600"
              - name: NCCL_DMABUF_ENABLE
                value: "0"
              - name: VLLM_ALLREDUCE_USE_FLASHINFER
                value: "1"
              - name: VLLM_USE_RUST_FRONTEND
                value: "1"
              - name: FI_PROVIDER
                value: "efa"
              - name: FI_EFA_USE_DEVICE_RDMA
                value: "1"
              - name: UCX_TLS
                value: "rc,cuda_copy"
              - name: NCCL_DEBUG
                value: "INFO"
              - name: PYTHONUNBUFFERED
                value: "1"
            resources:
              limits:
                nvidia.com/gpu: "8"
                vpc.amazonaws.com/efa: "8"
              requests:
                cpu: "96"
                memory: 1024Gi
            securityContext:
              capabilities:
                add: ["IPC_LOCK"]
            volumeMounts:
              - { name: models, mountPath: /models }
              - { name: dshm, mountPath: /dev/shm }
        volumes:
          - name: models
            emptyDir: { sizeLimit: 2000Gi }
          - name: dshm
            emptyDir: { medium: Memory, sizeLimit: 128Gi }
        terminationGracePeriodSeconds: 120
---
apiVersion: v1
kind: Service
metadata:
  name: kimi-k3-b200-lws
spec:
  selector:
    app: kimi-k3-b200
    role: leader
  ports:
    - { protocol: TCP, port: 8000, targetPort: 8000 }
