# Llama 4 Maverick 17B 128E Instruct at FP8 on one p6-b200.48xlarge, 8 GPUs, tensor parallel 8,
# FP8 KV cache, 32k context, FLASHINFER attention backend.
# SUBSTITUTE: WEIGHTS_BUCKET and AWS_REGION, in both containers.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama4-maverick-vllm-b200-fp8kv-32k-flashinfer
  labels: { app: llama4-maverick-vllm-b200-fp8kv-32k-flashinfer }
spec:
  # The S3 weight sync outlasts the 600 s default progress deadline.
  progressDeadlineSeconds: 7200
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: llama4-maverick-vllm-b200-fp8kv-32k-flashinfer }
  template:
    metadata:
      labels: { app: llama4-maverick-vllm-b200-fp8kv-32k-flashinfer }
    spec:
      serviceAccountName: llama4-maverick-bench
      nodeSelector:
        node.kubernetes.io/instance-type: p6-b200.48xlarge
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: fetch-weights
          image: public.ecr.aws/aws-cli/aws-cli:latest
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              aws configure set default.s3.max_concurrent_requests 64
              aws configure set default.s3.multipart_chunksize 64MB
              aws configure set default.s3.max_queue_size 10000

              echo "weights sync start $(date -u)"; df -h /models | tail -1
              # The emptyDir must be on the NVMe instance store; stop if it lacks the space.
              avail=$(df -Pk /models | awk 'NR==2 {print int($4/1048576)}')
              if [ "$avail" -lt "$MIN_FREE_GIB" ]; then
                echo "FATAL: ${avail} GiB free at /models, need ${MIN_FREE_GIB} GiB." >&2
                echo "  If that is a root disk rather than the NVMe array, this node's ephemeral" >&2
                echo "  storage is not on the instance store and the sync would fill it." >&2
                exit 1
              fi

              aws s3 sync "s3://${WEIGHTS_BUCKET}/${WEIGHTS_PREFIX}/" /models/llama4-maverick-fp8/ \
                --region "${AWS_REGION}" --only-show-errors
              SZ=$(du -s --block-size=1G /models/llama4-maverick-fp8 | cut -f1)
              SHARDS=$(find /models/llama4-maverick-fp8 -name '*.safetensors' | wc -l)
              echo "weights staged ${SZ} GiB, ${SHARDS} shards  $(date -u)"
              test "$SZ" -ge 360 || { echo "FATAL: expected ~388 GiB, got ${SZ} GiB" >&2; exit 1; }
              test "$SHARDS" -eq 84 || { echo "FATAL: expected 84 shards, got ${SHARDS}" >&2; exit 1; }
          env:
            - name: MIN_FREE_GIB
              value: "450"
            - name: WEIGHTS_BUCKET
              value: SUBSTITUTE-weights-bucket
            - name: WEIGHTS_PREFIX
              value: "llama4-maverick-fp8"
            - name: AWS_REGION
              value: "us-east-1"
          volumeMounts:
            - { name: models, mountPath: /models }
          resources:
            requests: { cpu: "16", memory: 32Gi }
            limits: { cpu: "32", memory: 64Gi }
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.29.0
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              echo "=== provenance (captured into the result bundle) ==="
              nvidia-smi --query-gpu=index,name,memory.total --format=csv
              nvidia-smi topo -m || true
              if nvidia-smi topo -m 2>/dev/null | grep -qE '\bNV[0-9]+\b'; then
                echo "  NVLink mesh detected - good."
              else
                echo "  WARNING: no NVLink pairs in topo matrix. Do not trust results."
              fi

              echo "=== flag surface check ==="
              for f in --attention-backend --kv-cache-dtype --max-cudagraph-capture-size \
                       --stream-interval --scheduling-policy --async-scheduling \
                       --no-enable-prefix-caching --max-num-batched-tokens; do
                vllm serve --help=all 2>/dev/null | grep -q -- "$f" \
                  && echo "  OK     $f" || echo "  ABSENT $f  <-- fix the command below"
              done

              echo "=== starting vLLM on ${INSTANCE_TYPE}: $(date -u) - loading ~388 GiB ==="
              ARGS=(
                /models/llama4-maverick-fp8
                --served-model-name llama4-maverick
                --tensor-parallel-size 8
                --kv-cache-dtype "${KV_CACHE_DTYPE}"
                --attention-backend "${ATTENTION_BACKEND}"
                --gpu-memory-utilization "${GPU_MEM_UTIL}"
                --max-model-len "${MAX_MODEL_LEN}"
                --max-num-seqs "${MAX_NUM_SEQS}"
                --max-num-batched-tokens "${MAX_NUM_BATCHED_TOKENS}"
                --stream-interval "${STREAM_INTERVAL}"
                --scheduling-policy "${SCHEDULING_POLICY}"
                --max-cudagraph-capture-size "${MAX_CUDAGRAPH}"
                --async-scheduling
                --no-enable-prefix-caching
                --enable-chunked-prefill
                --port 8000
              )
              printf '  argv: %s\n' "${ARGS[@]}"
              exec vllm serve "${ARGS[@]}"
          ports:
            - containerPort: 8000
          env:
            # No --quantization flag: vLLM detects the compressed-tensors FP8 export from the
            # checkpoint config.
            - name: KV_CACHE_DTYPE
              value: "fp8"
            - name: MAX_MODEL_LEN
              value: "32768"
            - name: MAX_NUM_SEQS
              value: "256"
            - name: MAX_NUM_BATCHED_TOKENS
              value: "32768"
            - name: STREAM_INTERVAL
              value: "10"
            - name: SCHEDULING_POLICY
              value: "fcfs"
            - name: MAX_CUDAGRAPH
              value: "256"
            - name: GPU_MEM_UTIL
              value: "0.90"
            # Passed as --attention-backend because vLLM 0.29.0 ignores VLLM_ATTENTION_BACKEND.
            - name: ATTENTION_BACKEND
              value: "FLASHINFER"
            - name: INSTANCE_TYPE
              value: "p6-b200.48xlarge"
            - name: BENCH_CONFIG
              value: "b200-fp8kv-32k-tp8-flashinfer"
            - name: PYTHONUNBUFFERED
              value: "1"
            # INFO logs the selected attention backend and quantization method at startup.
            - name: VLLM_LOGGING_LEVEL
              value: "INFO"
          resources:
            limits:
              nvidia.com/gpu: "8"
              memory: 1600Gi
            requests:
              cpu: "96"
              memory: 512Gi
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 15
            failureThreshold: 240
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 30
            failureThreshold: 6
          volumeMounts:
            - { name: models, mountPath: /models }
            - { name: dshm, mountPath: /dev/shm }
      volumes:
        - name: models
          emptyDir: { sizeLimit: 900Gi }
        - name: dshm
          emptyDir: { medium: Memory, sizeLimit: 64Gi }
      terminationGracePeriodSeconds: 120
---
apiVersion: v1
kind: Service
metadata:
  name: llama4-maverick-vllm-b200-fp8kv-32k-flashinfer
spec:
  selector: { app: llama4-maverick-vllm-b200-fp8kv-32k-flashinfer }
  ports:
    - { protocol: TCP, port: 8000, targetPort: 8000 }
