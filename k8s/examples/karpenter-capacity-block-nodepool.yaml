#
# Karpenter NodePool and EC2NodeClass that launch GPU nodes only into one EC2 Capacity Block (or
# On-Demand Capacity Reservation), with the local NVMe instance store RAID0-mounted as ephemeral
# storage so model weights stage onto NVMe rather than the EBS root volume.
#
# Instance types in this repo that require a capacity block (AWS also supports others: the P6e-GB200,
# P6-B200, P6-B300, P5en, P5e, P5, P4d families).
#
# scripts/provision-capacity-block.sh fills the placeholders and applies this. Do not kubectl apply it directly.
# SUBSTITUTE: NODE_NAME, NODE_ROLE, CLUSTER_NAME, INSTANCE_TYPE, RESERVATION_ID (the script fills these).
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: NODE_NAME
spec:
  # Resolves to the accelerated AL2023 AMI (NVIDIA driver) for GPU instance types.
  amiSelectorTerms:
    - alias: al2023@latest
  role: NODE_ROLE
  subnetSelectorTerms:
    - tags: { karpenter.sh/discovery: CLUSTER_NAME }
  securityGroupSelectorTerms:
    - tags: { karpenter.sh/discovery: CLUSTER_NAME }
  capacityReservationSelectorTerms:
    - id: RESERVATION_ID
  # Mounts every instance-store NVMe device as one RAID0 array for kubelet ephemeral storage.
  instanceStorePolicy: RAID0
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs: { volumeSize: 100Gi, volumeType: gp3, encrypted: true, deleteOnTermination: true }
  metadataOptions:
    httpEndpoint: enabled
    httpTokens: required
    httpPutResponseHopLimit: 1
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: NODE_NAME
spec:
  template:
    spec:
      nodeClassRef: { group: karpenter.k8s.aws, kind: EC2NodeClass, name: NODE_NAME }
      requirements:
        # "reserved" only: nothing launches outside the reservation, so no on-demand spill.
        - { key: karpenter.sh/capacity-type, operator: In, values: [reserved] }
        - { key: node.kubernetes.io/instance-type, operator: In, values: [INSTANCE_TYPE] }
      taints:
        - { key: nvidia.com/gpu, effect: NoSchedule }
      expireAfter: 720h
  # One node's worth of GPUs, so the pool stops at a single benchmark node; raise it for a multi-node run.
  limits:
    nvidia.com/gpu: GPU_LIMIT
  # Remove the node only once it is empty, so a benchmark is never evicted mid-run.
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 1h
