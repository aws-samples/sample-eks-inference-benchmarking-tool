#
# Job that downloads model weights from Hugging Face onto a shared PVC, once. Use this when a recipe expects weights already on the PVC, the filesystem exists, and the availability zone is settled.
#
# SUBSTITUTE: fsx-pvc, the model id, the destination path, and EXPECTED_SHARDS.
apiVersion: batch/v1
kind: Job
metadata:
  name: download-model-weights
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: downloader
          image: python:3.12-slim
          command: ["bash", "-lc"]
          env:
            - name: MODEL_REPO
              value: Qwen/Qwen2.5-7B-Instruct
            - name: MODEL_DIR
              value: /models/my-model
            - name: EXPECTED_SHARDS
              value: "141"
            - name: HF_HOME
              value: /models/.hf-cache
            # Xet is off here on purpose, and that now costs you the only accelerated path. See the README.
            - name: HF_HUB_DISABLE_XET
              value: "1"
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
          args:
            - |
              set -euo pipefail

              echo "=== free space before ==="; df -h /models

              if [ -f "$MODEL_DIR/model.safetensors.index.json" ]; then
                have=$(ls "$MODEL_DIR"/*.safetensors 2>/dev/null | wc -l)
                if [ "$have" -eq "$EXPECTED_SHARDS" ]; then
                  echo "already complete: $have/$EXPECTED_SHARDS shards, nothing to do"
                  exit 0
                fi
                echo "resuming: $have/$EXPECTED_SHARDS shards present"
              fi

              pip install --no-cache-dir -q huggingface_hub==1.28.0

              echo "=== starting download $(date -u) ==="
              hf download "$MODEL_REPO" --local-dir "$MODEL_DIR"
              echo "=== download complete $(date -u) ==="

              have=$(ls "$MODEL_DIR"/*.safetensors | wc -l)
              want=$(grep -o 'model-[0-9]\{5\}-of-[0-9]\{5\}' "$MODEL_DIR/model.safetensors.index.json" \
                     | sort -u | wc -l)
              echo "shards on disk: $have, index expects: $want"
              test "$have" -eq "$want" || { echo "FATAL: shard count mismatch" >&2; exit 1; }
              echo "=== free space after ==="; df -h /models
          volumeMounts:
            - name: models
              mountPath: /models
          resources:
            requests:
              cpu: "8"
              memory: 32Gi
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: fsx-pvc
