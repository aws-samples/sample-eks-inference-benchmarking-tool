#
# nodeadm NodeConfig that stripes every local NVMe instance-store volume into one RAID0 array and moves kubelet and
# containerd storage onto it, so weight staging and image pulls use the instance store instead of the EBS root volume.
# Put it in the launch template user data of an EKS managed nodegroup (AL2023 AMIs, no custom AMI ID); EKS merges it
# with the NodeConfig it generates.
#
# Launch template user data is this document wrapped as a MIME part:
#
#   MIME-Version: 1.0
#   Content-Type: multipart/mixed; boundary="BOUNDARY"
#
#   --BOUNDARY
#   Content-Type: application/node.eks.aws
#
#   <the YAML below>
#
#   --BOUNDARY--
#
# Verify on a pod after it schedules: `df -h /models` must show the md RAID device, not the root.
#
# SUBSTITUTE: nothing.
---
apiVersion: node.eks.aws/v1alpha1
kind: NodeConfig
spec:
  instance:
    localStorage:
      strategy: RAID0
