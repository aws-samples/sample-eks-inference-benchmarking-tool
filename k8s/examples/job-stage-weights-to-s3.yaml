#
# Job that stages weights from Hugging Face into S3, once, so any cluster can pull them later. Use this when the availability zone is still undecided and the filesystem does not exist yet.
#
# SUBSTITUTE: 012345678901, us-east-1, my-model-weights, and the model id.
apiVersion: batch/v1
kind: Job
metadata:
  name: stage-weights-to-s3
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        role: system
      containers:
        - name: stager
          image: python:3.12-slim
          command: ["bash", "-lc"]
          env:
            - name: MODEL_REPO
              value: Qwen/Qwen2.5-7B-Instruct
            - name: BUCKET
              value: my-model-weights
            - name: PREFIX
              value: qwen2.5-7b-instruct
            - name: STAGE_DIR
              value: /staging/model
            - name: HF_HOME
              value: /staging/.hf-cache
            # Xet is disabled; it stalls on very large repositories.
            - name: HF_HUB_DISABLE_XET
              value: "1"
            - name: AWS_REGION
              value: us-east-1
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
          args:
            - |
              set -euo pipefail

              pip install --no-cache-dir -q huggingface_hub==1.28.0 awscli

              echo "=== downloading $MODEL_REPO $(date -u) ==="
              hf download "$MODEL_REPO" --local-dir "$STAGE_DIR"

              echo "=== uploading to s3://$BUCKET/$PREFIX/ $(date -u) ==="
              aws s3 sync "$STAGE_DIR" "s3://$BUCKET/$PREFIX/" --only-show-errors

              echo "=== verifying $(date -u) ==="
              local_count=$(find "$STAGE_DIR" -name '*.safetensors' | wc -l)
              s3_count=$(aws s3 ls "s3://$BUCKET/$PREFIX/" | grep -c '\.safetensors')
              echo "local shards: $local_count, in S3: $s3_count"
              test "$local_count" -eq "$s3_count" || { echo "FATAL: shard count mismatch" >&2; exit 1; }
              echo "=== staged $(date -u) ==="
          volumeMounts:
            - name: staging
              mountPath: /staging
          resources:
            requests:
              cpu: "8"
              memory: 32Gi
      volumes:
        - name: staging
          emptyDir:
            sizeLimit: 200Gi
