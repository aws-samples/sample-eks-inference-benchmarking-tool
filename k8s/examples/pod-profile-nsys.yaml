#
# Pod that runs a vLLM server under Nsight Systems to show where step time goes. Use this when a sweep shows a ceiling the metrics do not explain and you need to know what that time is made of.
#
# SUBSTITUTE: 012345678901, us-east-1, the image, the model, TP size, and instance type.
apiVersion: v1
kind: Pod
metadata:
  name: profile-vllm
spec:
  restartPolicy: Never
  nodeSelector:
    node.kubernetes.io/instance-type: g7e.12xlarge
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: vllm
      image: 012345678901.dkr.ecr.us-east-1.amazonaws.com/vllm-nsys:my-tag
      command: ["bash", "-lc"]
      args:
        - |
          set -euo pipefail
          echo "=== provenance ==="
          nvidia-smi --query-gpu=index,name,memory.total --format=csv
          nvidia-smi topo -m || true
          nsys --version
          mkdir -p /traces

          echo "=== launching vLLM under nsys $(date -u) ==="
          nsys profile \
            -t cuda,nvtx,osrt,cudnn,cublas \
            --delay "${NSYS_DELAY:-300}" \
            --duration "${NSYS_DURATION:-90}" \
            --force-overwrite true \
            -o /traces/vllm-trace \
            vllm serve "${MODEL}" \
              --tensor-parallel-size "${TP_SIZE}" \
              --port 8000 \
            || echo "nsys/vllm exited rc=$? (expected: nsys stops the target)"

          echo "############ CAPTURE COMPLETE ############"
          ls -la /traces/*.nsys-rep || { echo "FATAL: no trace produced"; sleep 600; exit 1; }

          set +e
          for rpt in cuda_gpu_kern_sum nvtx_sum cuda_api_sum osrt_sum cuda_gpu_mem_time_sum; do
            echo ""
            echo "===================== nsys stats: $rpt ====================="
            nsys stats --report "$rpt" --format table \
              -o /traces/stats-$rpt /traces/vllm-trace.nsys-rep > /traces/$rpt.out 2>&1
            cat /traces/$rpt.out
          done
          set -e

          echo "############ holding open for kubectl cp ############"
          sleep 3600
      env:
        - name: MODEL
          value: "Qwen/Qwen2.5-7B-Instruct"
        - name: TP_SIZE
          value: "2"
        - name: NSYS_DELAY
          value: "300"
        - name: NSYS_DURATION
          value: "90"
        - name: VLLM_LOGGING_LEVEL
          value: "WARNING"
      ports:
        - containerPort: 8000
      resources:
        limits:
          nvidia.com/gpu: "2"
      securityContext:
        capabilities:
          add:
            - SYS_ADMIN
            - IPC_LOCK
      volumeMounts:
        - name: traces
          mountPath: /traces
        - name: dshm
          mountPath: /dev/shm
  volumes:
    - name: traces
      emptyDir:
        sizeLimit: 100Gi
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi
